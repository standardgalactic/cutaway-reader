name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: pip install -r requirements-dev.txt && python3 -m playwright install --with-deps chromium
      - run: python3 corpus.py build corpus/corpus.json && python3 corpus.py export corpus/data corpus/data/bundle.json
      - run: python3 corpus.py build trial/corpus.json && python3 corpus.py export trial/data trial/data/bundle.json
      - run: python3 test_all.py
