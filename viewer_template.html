<title>Cutaway Reader</title>
<!--FONTS-->
<style>
/* Single dark look by choice: this is a cockpit and an automap console. */
:root{
  color-scheme: dark;
  --bg:#030607; --stage:#000000; --panel:#081012; --panel-2:#0c1719; --line:#16292b;
  --ink:#c3d2ce; --muted:#6b8480; --wire:#dfe9e5; --revealed:#3a67d8;
  --you:#3fe07f; --route:#f2c14e; --exit:#d65ad8; --door:#ff8a3d; --thread:#ff5a52;
  --paper:#0e1416; --paper-ink:#d9e2de;
  --hud:"VT323", "Courier New", monospace;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --serif:"Source Serif 4", Georgia, "Times New Roman", serif;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.45 var(--mono);overflow:hidden}
.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 320px}
.stage{position:relative;background:var(--stage);outline:none;overflow:hidden}
.stage canvas{display:block;width:100%;height:100%}
.stage canvas{touch-action:none}
.stage:focus-visible{box-shadow:inset 0 0 0 2px var(--you)}

/* flight HUD */
.hud{position:absolute;inset:0;pointer-events:none;font-family:var(--hud);color:var(--you);letter-spacing:.04em}
.hud .tl{position:absolute;left:16px;top:12px;font-size:20px;line-height:1.05;text-shadow:0 0 6px rgba(63,224,127,.45)}
.hud .tl .work{color:var(--muted);font-size:17px}
.hud .tl .loc{color:var(--wire)}
.hud .tr{position:absolute;right:16px;top:12px;font-size:17px;text-align:right;color:var(--muted)}
.hud .tr b{font-weight:400;color:var(--you)}
.reticle{position:absolute;left:50%;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border:1px solid rgba(63,224,127,.55);border-radius:50%}
.reticle::after{content:"";position:absolute;left:50%;top:50%;width:3px;height:3px;margin:-1.5px;background:var(--you)}
.corner{position:absolute;width:22px;height:22px;border-color:rgba(63,224,127,.5);border-style:solid}
.c1{left:10px;top:10px;border-width:1px 0 0 1px}.c2{right:10px;top:10px;border-width:1px 1px 0 0}
.c3{left:10px;bottom:10px;border-width:0 0 1px 1px}.c4{right:10px;bottom:10px;border-width:0 1px 1px 0}
.rear-tag{position:absolute;left:50%;top:12%;transform:translateX(-50%);font-size:24px;color:var(--route);text-align:center;line-height:1.1}
.rear-tag ol{margin:4px 0 0;padding:0;list-style:none;font-size:18px;color:var(--you)}
.toast{position:absolute;left:50%;bottom:64px;transform:translateX(-50%);font-size:20px;color:var(--wire);background:rgba(0,0,0,.7);padding:2px 10px;max-width:calc(100% - 32px);text-align:center}
.card{position:absolute;left:50%;bottom:96px;transform:translateX(-50%);width:min(440px,calc(100% - 32px));
  background:rgba(4,10,12,.92);border:1px solid var(--line);padding:10px 12px;font:12px/1.5 var(--mono);color:var(--ink);pointer-events:none}
.card h3{margin:0 0 4px;font:22px/1 var(--hud);color:var(--wire);letter-spacing:.03em;text-wrap:balance}
.card .meta{color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-size:10.5px;margin-bottom:6px}
.card ul{margin:4px 0 0;padding-left:16px}
.keys{position:absolute;left:0;right:0;bottom:0;padding:6px 16px calc(6px + env(safe-area-inset-bottom,0px));font:15px/1.3 var(--hud);
  color:var(--muted);background:linear-gradient(transparent,rgba(0,0,0,.85));display:flex;flex-wrap:wrap;gap:4px 16px}
.keys kbd{font:inherit;color:var(--you)}
.focus-hint{position:absolute;left:50%;top:62%;transform:translateX(-50%);font:18px var(--hud);color:var(--route);text-align:center}
.mobile-controls{display:none;position:absolute;inset:0;z-index:3;pointer-events:none;font-family:var(--hud);user-select:none;-webkit-user-select:none}
.mobile-stick{position:absolute;left:18px;bottom:calc(24px + env(safe-area-inset-bottom,0px));width:112px;height:112px;border:1px solid rgba(63,224,127,.5);border-radius:50%;background:rgba(2,8,9,.55);pointer-events:auto;touch-action:none}
.mobile-knob{position:absolute;left:38px;top:38px;width:36px;height:36px;border-radius:50%;background:rgba(63,224,127,.75);box-shadow:0 0 12px rgba(63,224,127,.35)}
.mobile-actions{position:absolute;right:14px;bottom:calc(20px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(2,56px);gap:8px;pointer-events:auto}
.mobile-actions button{min-height:44px;border:1px solid rgba(63,224,127,.55);background:rgba(2,8,9,.75);color:var(--you);font:17px var(--hud);border-radius:4px;touch-action:none}
.mobile-actions button:active{background:var(--you);color:#001406}
.mobile-look{position:absolute;left:18px;bottom:calc(146px + env(safe-area-inset-bottom,0px));color:var(--muted);font-size:15px;text-shadow:0 1px 2px #000}

/* automap console frame (Descent-style) */
.stage.map .hud .reticle,.stage.map .hud .corner,.stage.map .hud .tl,.stage.map .hud .tr{display:none}
.mapframe{position:absolute;inset:0;pointer-events:none;border:10px solid #1d2a2c;box-shadow:inset 0 0 0 1px #3b5153, inset 0 0 0 3px #0b1112}
.mapframe .title{position:absolute;left:18px;top:6px;font:30px/1 var(--hud);color:#e8b04b;letter-spacing:.12em;text-shadow:0 2px 0 #6b3d05}
.mapframe .depth{position:absolute;right:18px;top:12px;font:18px var(--hud);color:var(--you)}
.mapframe .legend{position:absolute;right:18px;top:40px;font:15px/1.25 var(--hud);color:var(--muted);text-align:right}
.mapframe .ghelp{position:absolute;left:18px;bottom:40px;font:16px var(--hud);color:var(--muted)}
.panel .abstract{color:var(--ink);font-size:12px;line-height:1.5}
.legend i{display:inline-block;width:18px;height:2px;vertical-align:middle;margin-left:6px}
.lg-wire{background:var(--wire)}.lg-revealed{background:var(--revealed)}.lg-you{background:var(--you)}.lg-route{background:var(--route)}
.lg-door{background:var(--door)}.lg-exit{background:var(--exit)}.lg-thread{background:var(--thread)}
.card .meta.foot{margin:6px 0 0}

/* reading station */
.reader{position:absolute;inset:0;background:var(--paper);overflow-y:auto;outline:none;scroll-behavior:smooth}
.reader .col{max-width:64ch;margin:0 auto;padding:28px 20px 80px}
.reader figure{margin:0 0 22px;aspect-ratio:16/7;max-width:100%;border:1px solid var(--line);display:grid;place-items:center;
  background:repeating-linear-gradient(135deg,#0b1214 0 10px,#0d1618 10px 20px);color:var(--muted);font:12px var(--mono)}
.reader .role{font:11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.reader h2{font:600 30px/1.15 var(--serif);color:var(--paper-ink);margin:6px 0 18px;text-wrap:balance}
.reader p{font:18px/1.62 var(--serif);color:var(--paper-ink);margin:0 0 1em}
.reader .ref{font:13px var(--mono);color:var(--door)}
.reader .threads{margin-top:28px;border-top:1px solid var(--line);padding-top:12px;font:12.5px/1.6 var(--mono);color:var(--ink)}
.reader .back{position:sticky;top:0;background:var(--paper);padding:10px 20px;font:16px var(--hud);color:var(--muted);border-bottom:1px solid var(--line);z-index:1}
.reader .back kbd{font:inherit;color:var(--you)}

/* text navigator: a Lynx-like projection of the same world */
.textnav{position:absolute;inset:0;background:#000;color:#c8d6d2;overflow-y:auto;outline:none;font:14px/1.55 var(--mono)}
.textnav .col{max-width:86ch;margin:0 auto;padding:14px 20px 110px}
.tn-title{font:26px/1.1 var(--hud);color:var(--you);letter-spacing:.05em;margin:0 0 6px}
.tn-meta{display:grid;grid-template-columns:max-content 1fr;gap:0 14px;color:var(--muted);margin:0 0 10px}
.tn-meta dt{text-transform:uppercase;font-size:11px;letter-spacing:.1em;padding-top:2px}
.tn-meta dd{margin:0;color:var(--ink)}
.tn-h{margin:14px 0 4px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.tn-list{list-style:none;margin:0;padding:0}
.tn-list li{padding:1px 6px;display:flex;gap:10px;align-items:baseline}
.tn-list li .n{color:var(--you);min-width:3.4ch;font-variant-numeric:tabular-nums}
.tn-list li .d{color:var(--muted)}
.tn-list li .s{margin-left:auto;font-size:11px;color:var(--muted);white-space:nowrap}
.tn-list li.sel{background:var(--you);color:#000}
.tn-list li.sel .n,.tn-list li.sel .d,.tn-list li.sel .s{color:#000}
.tn-list li.glimpse{color:var(--revealed)}
.tn-list li .pre{color:var(--door)}
.tn-list li.sel .pre{color:#000}
.tn-prose{margin-top:18px;border-top:1px solid var(--line);padding-top:14px}
.tn-prose p{margin:0 0 1em;max-width:72ch;color:var(--paper-ink)}
.tn-prose .ref{color:var(--door)}
.tn-fig{color:var(--muted);font-style:italic;margin-bottom:12px}
.tn-bar{position:absolute;left:0;right:0;bottom:0;background:#050b0c;border-top:1px solid var(--line);padding:6px 16px calc(6px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:4px}
.tn-bar .msg{color:var(--route);min-height:1.4em}
.tn-bar .help{color:var(--muted);font-size:12px}
.tn-bar .help kbd{font:inherit;color:var(--you)}
.tn-bar input{font:14px var(--mono);background:#000;color:var(--wire);border:1px solid var(--you);padding:4px 8px}

/* beacon note (cockpit) */
.note{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);width:min(420px,calc(100% - 32px));
  background:#050b0c;border:1px solid var(--you);padding:12px;display:flex;flex-direction:column;gap:8px}
.note label{font:18px var(--hud);color:var(--you)}
.note input{font:14px var(--mono);background:#000;color:var(--wire);border:1px solid var(--line);padding:8px}
.note input:focus{outline:1px solid var(--you)}
.note small{color:var(--muted)}

/* supervisory panel (Stars!-style) */
.panel{background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;padding-block:12px 24px}
.panel section{padding:10px 16px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.panel h4{margin:0;font:11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:500}
.panel .big{font:22px/1.05 var(--hud);color:var(--wire);text-wrap:balance}
.panel .sub{color:var(--muted);font-size:11.5px}
.row{display:flex;justify-content:space-between;gap:8px;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:12px var(--mono);background:var(--panel-2);border:1px solid var(--line);color:var(--ink);padding:3px 8px;cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--route);color:var(--route)}
.chip:hover{border-color:var(--muted)}
.chip:focus-visible{outline:1px solid var(--you)}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.list li{display:flex;gap:8px;align-items:baseline}
.list .n{font:17px/1 var(--hud);color:var(--you);min-width:1.4em}
.list .k{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);min-width:7.5em}
.list button{all:unset;cursor:pointer;color:var(--ink)}
.list button:hover,.list button:focus-visible{color:var(--wire);text-decoration:underline}
.change{color:var(--route)}
.save{font-size:11px;color:var(--muted)}
.save b{font-weight:500;color:var(--ink)}
.merge{font:12px var(--mono);background:#000;color:var(--ink);border:1px solid var(--line);padding:5px 8px;max-width:100%}
.merge:focus{outline:1px solid var(--you)}

@media (max-width:760px){
  body{overflow:auto}
  .app{grid-template-columns:1fr;grid-template-rows:62vh auto;height:auto}
  .panel{border-left:0;border-top:1px solid var(--line)}
  .keys{font-size:13px}
}
@media (pointer:coarse){
  .mobile-controls:not([hidden]){display:block}
  .keys{display:none}
  .card{bottom:154px}
  .mapframe .ghelp{top:62px;bottom:auto;left:18px;max-width:48%;font-size:14px}
}
@media (prefers-reduced-motion:reduce){.reader{scroll-behavior:auto}}
</style>

<div class="app">
  <div class="stage" id="stage" tabindex="0" aria-label="Flight view. Use the keyboard to fly, or press T for the text navigator.">
    <div class="mapframe" id="mapframe" hidden>
      <div class="title">AUTOMAP</div>

      <div class="legend">
        traversed<i class="lg-wire"></i><br>
        revealed<i class="lg-revealed"></i><br>
        you / trail<i class="lg-you"></i><br>
        route<i class="lg-route"></i><br>
        prerequisite door<i class="lg-door"></i><br>
        exit<i class="lg-exit"></i><br>
        open thread<i class="lg-thread"></i>
      </div>
    </div>
    <div class="hud">
      <div class="corner c1"></div><div class="corner c2"></div><div class="corner c3"></div><div class="corner c4"></div>
      <div class="reticle"></div>
      <div class="tl"><div class="work" id="hudWork"></div><div class="loc" id="hudLoc"></div><div id="hudMode"></div></div>
      <div class="tr" id="hudRight"></div>
      <div class="rear-tag" id="rearTag" hidden></div>

    <div class="mobile-controls" id="mobileControls" hidden aria-label="Touch flight controls">
      <div class="mobile-look" id="mobileLook">drag to look</div>
      <div class="mobile-stick" id="mobileStick" aria-label="Move"><div class="mobile-knob" id="mobileKnob"></div></div>
      <div class="mobile-actions">
        <button id="mUp" aria-label="Move up">UP</button><button id="mInspect" aria-label="Inspect">LOOK</button>
        <button id="mDown" aria-label="Move down">DOWN</button><button id="mRead" aria-label="Read here">READ</button>
        <button id="mMap" aria-label="Toggle map">MAP</button><button id="mCruise" aria-label="Toggle cruise">GO</button>

      <label for="noteInput" id="noteLabel">Beacon</label>
      <input id="noteInput" maxlength="120" placeholder="Why come back here?" autocomplete="off">
      <small>Enter drops the beacon. Esc cancels.</small>
    </div>
    <div class="reader" id="reader" tabindex="-1" hidden></div>
    <div class="textnav" id="textnav" tabindex="-1" hidden aria-label="Text navigator">
      <div class="col" id="tnBody"></div>
    </div>
    <div class="tn-bar" id="tnBar" hidden>
      <div class="msg" id="tnMsg" aria-live="polite"></div>
      <input id="tnInput" autocomplete="off" hidden aria-label="Command input">
      <div class="help" id="tnHelp"></div>
    </div>
  </div>

  <aside class="panel" id="panel" aria-label="Supervisory view"></aside>
</div>

<script type="application/json" id="level-data">__LEVEL__</script>
<!--THREE-->
<!--MODEL-->
<script>
(() => {
"use strict";
const CM = window.CutawayModel;
const BUNDLE = CM.asBundle(JSON.parse(document.getElementById("level-data").textContent));
const C = CM.buildCorpus(BUNDLE, { // a split export (index + works/<id>.json) is fetched a work at a time
  fetch: (id) => fetch(BUNDLE.split + encodeURIComponent(id) + ".json").then(r => r.ok ? r.json() : Promise.reject(new Error(r.status + " " + id))) });
const V3 = (a) => new THREE.Vector3(a[0], a[1], a[2]);
const css = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const COL = { wire: css("--wire"), revealed: css("--revealed"), you: css("--you"), route: css("--route"),
  exit: css("--exit"), door: css("--door"), thread: css("--thread"), muted: css("--muted"), bg: "#000000", sealed: "#56605f" };
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const wtitle = (id) => C.works.get(id)?.title || id;
const inBox = (p, n, g = 0) => Math.abs(p.x - n.pos[0]) < n.r - g && Math.abs(p.y - n.pos[1]) < n.r - g && Math.abs(p.z - n.pos[2]) < n.r - g;

/* the work currently loaded; everything below that says m, live, geo or portals means this work */
let WORK = null, m = null, live = [], centroid = new THREE.Vector3(), geo = new Map(), portalGeo = [];
const title = (id) => m.nodes.get(id)?.title || id;

/* ================= reader log: one history for every interface and every work ================= */
const LSKEY = "cutaway-reader:" + C.id;
const actor = (() => { try { let a = localStorage.getItem("cutaway-actor"); if (!a) { a = CM.newActor(); localStorage.setItem("cutaway-actor", a); } return a; } catch (_) { return CM.newActor(); } })();
let events = [], S = null, CS = null, bootMoved = false;
const inCorpus = (e) => !e.work || C.works.has(e.work);
const Store = {
  kind: "memory", remote: null, queue: Promise.resolve(), failed: false,
  readLocal() {
    try {
      let out = []; const raw = localStorage.getItem(LSKEY);
      if (raw) out = CM.upgrade(JSON.parse(raw).events || [], actor);
      // logs written by earlier single-work pages live under each work's own key: fold them in
      for (const wid of C.works.keys()) { const k = "cutaway-reader:" + wid; if (k === LSKEY) continue;
        const r = localStorage.getItem(k); if (!r) continue;
        out = CM.merge(out, CM.upgrade(JSON.parse(r).events || [], actor).map(e => (e.work || e.t === "session" ? e : Object.assign({}, e, { work: wid })))); }
      return out.filter(inCorpus);
    } catch (_) { return null; }
  },
  saveLocal() {
    try { const merged = CM.merge(this.readLocal() || [], events);
      localStorage.setItem(LSKEY, JSON.stringify({ v: 3, events: merged }));
      if (this.kind === "memory") this.kind = "browser";
      if (merged.length > events.length) absorb(merged);
    } catch (_) { /* no browser storage: the log lives in memory for this visit */ }
  },
  push(newEvents) {
    this.saveLocal();
    if (this.remote) for (const e of newEvents)
      this.queue = this.queue.then(() => this.remote.doc(e.id).set(e)).catch(() => { this.failed = true; renderPanel(); });
  },
  async connect() {
    if (!window.claude || !window.claude.use) return;
    try {
      const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
      if (!db || !user) return;
      const uid = await user.id(); if (!uid) return;
      const col = db.collection("data/users/" + uid);
      const fromDocs = (docs) => { let out = [];
        for (const d of docs) { const x = d.data(); if (!x) continue;
          if (Array.isArray(x.events)) out = CM.merge(out, CM.upgrade(JSON.parse(JSON.stringify(x.events)), actor)); // first-version log
          else if (x.id && x.t && inCorpus(x)) out.push(JSON.parse(JSON.stringify(x))); }
        return CM.upgrade(out, actor).filter(inCorpus); };
      const snap = await col.get(), remote = fromDocs(snap.docs), have = new Set(remote.map(e => e.id));
      this.remote = col; this.kind = "account";
      const missing = events.filter(e => !have.has(e.id));
      absorb(CM.merge(events, remote)); this.push(missing);
      col.onSnapshot(s => absorb(CM.merge(events, fromDocs(s.docs))), () => {});
      renderPanel();
    } catch (_) { /* stays on browser storage */ }
  },
};
window.addEventListener("storage", (e) => { if (e.key === LSKEY) { const x = Store.readLocal(); if (x) absorb(CM.merge(events, x)); } });
function absorb(merged) {
  if (merged.length === events.length) return;
  events = merged; rederive();
  if (!bootMoved && CS.here && (CS.here !== WORK || (S.here && S.here !== curChamber))) { const target = CS.here;
    C.ensure(target).then(() => { if (!bootMoved && CS.here === target) { loadWork(target); spawn(); renderAll(); } }, () => {}); }
  renderAll();
}
function append(bodies) {
  const out = [];
  for (const b of bodies) { const e = CM.stamp(events, actor, Object.assign({ work: WORK }, b)); events.push(e); out.push(e); }
  if (bodies.some(b => b.t === "enter" || b.t === "traverse" || b.t === "jump")) bootMoved = true;
  rederive(); Store.push(out); return out;
}
function rederive() { CS = CM.deriveCorpus(C, events); S = m ? CM.derive(m, CM.workEvents(events, WORK)) : null; }

/* ================= renderer, scenes, shared geometry helpers ================= */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const stage = $("stage"); stage.prepend(renderer.domElement);
const flight = new THREE.Scene(); flight.background = new THREE.Color(COL.bg); flight.fog = new THREE.Fog(COL.bg, 18, 115);
const mapScene = new THREE.Scene(); mapScene.background = new THREE.Color(COL.bg);
const galaxy = new THREE.Scene(); galaxy.background = new THREE.Color(COL.bg);
const cam = new THREE.PerspectiveCamera(75, 1, 0.1, 2000);
const mapCam = new THREE.PerspectiveCamera(55, 1, 0.1, 8000);
const lineMat = (color, opacity = 1) => new THREE.LineBasicMaterial({ color, transparent: opacity < 1, opacity });
function segs(arr, mat) { const g = new THREE.BufferGeometry(); g.setAttribute("position", new THREE.Float32BufferAttribute(arr, 3)); return new THREE.LineSegments(g, mat); }
const push = (arr, p, q) => arr.push(p.x, p.y, p.z, q.x, q.y, q.z);
function hash(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function rng(seed) { return () => { seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);

const SPEEDS = [5, 10, 18];
function startCruise() {

  if (!stops.length) { toast(S.policy === "bound" ? "No chambers bound yet: inspect one with Y, then press U" : "You are at the end of this route"); return; }
  const pts = [P.pos.clone(), V3(m.nodes.get(curChamber).pos)]; let at = curChamber; const used = [];
  for (const tgt of stops) { const hops = CM.pathBetween(m, at, tgt); if (!hops) continue;
    for (const h of hops) { const g = geo.get(h.t.key), seq = g.a === h.from ? g.pts : g.pts.slice().reverse(); pts.push(...seq.slice(1)); }

  .map(([k, v]) => `<span><kbd>${k}</kbd> ${v}</span>`).join("");
function fmtWhen(iso) { if (!iso) return ""; return new Date(iso).toLocaleString(undefined, { weekday: "short", month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" }); }
function renderPanel() {
  const here = m.nodes.get(curChamber), prev = S.prevSession, w = C.works.get(WORK);
  const revs = m.history.filter(h => h.added.length || h.extended.length || h.withdrawn.length);
  const since = prev ? revs.filter(h => h.at > prev.at) : revs.slice(-1);
  const changes = since.flatMap(h => [...h.added.map(id => ["dug", id]), ...h.extended.map(id => ["enlarged", id]), ...h.withdrawn.map(id => ["sealed", id])]);
  const galaxyChanges = (BUNDLE.corpus.ledger.history || []).filter(h => prev && h.at > prev.at && (h.placed || h.withdrawn || h.conflict || h.restored))
    .map(h => h.placed ? ["new system", h.placed] : h.withdrawn ? ["withdrawn", h.withdrawn] : h.restored ? ["restored", h.restored] : ["placement conflict", h.conflict]);
  const threads = live.flatMap(n => n.threads.map(t => ({ ...t, id: n.id })));
  const targets = CM.routeTargets(m, S), lastT = S.trail[S.trail.length - 1];
  const secs = CM.sections(m), vis = secs.filter(n => S.visited.has(n.id)).length;
  const saveTxt = Store.kind === "account" ? "<b>Saved to your account</b>" : Store.kind === "browser" ? "<b>Saved in this browser only</b>" : "Not saved: this visit only";
  const actors = new Set(events.map(e => e.actor)).size, worksVisited = [...C.works.values()].filter(x => CS.visited.has(x.id)).length;
  $("panel").innerHTML = `
  <section><h4>${esc(C.title)}</h4><div class="big">${esc(w.title)}</div>
    <div class="sub">${w.series ? esc(C.series[w.series]?.title || w.series) + " · " : ""}${worksVisited} of ${C.works.size} works visited · ${CS.lanesUsed.size} lanes used${CS.warps ? " · " + CS.warps + " warps" : ""}</div>
    ${w.abstract ? `<div class="abstract">${esc(w.abstract)}</div>` : ""}
    <div class="chips">${C.views.map(v => `<button class="chip" data-view="${esc(v.id)}">${esc(v.title)}</button>`).join("")}</div></section>
  <section><h4>Position</h4><div class="big">${here ? esc(here.title) : curTunnel ? esc(title(curTunnel.a)) + " ⇄ " + esc(title(curTunnel.b)) : "—"}</div>
    <div class="sub">${here ? CM.ROLE_TEXT[here.role] : "in a passage"}${lastT && here && lastT.to === here.id ? " · arrived from " + esc(title(lastT.from)) : ""}</div>
    <div class="chips"><button class="chip" id="bMap">Map</button><button class="chip" id="bText">Text navigator</button><button class="chip" id="bRead">Read here</button><button class="chip" id="bCruise">${cruise ? "Stop cruise" : mode === "text" ? "Next stop" : "Cruise route"}</button></div></section>
  <section><h4>${prev ? "Since your last visit" : "Latest source revision"}</h4>
    <div class="sub">${prev ? "Last here " + fmtWhen(prev.at) : "First visit" + (since[0] ? " · revised " + fmtWhen(since[0].at) : "")}</div>
    ${changes.length || galaxyChanges.length ? `<ul class="list">${changes.map(([k, id]) => `<li><span class="k">${k}</span><button data-read="${esc(id)}" class="change">${esc(title(id))}</button></li>`).join("")}${galaxyChanges.map(([k, id]) => `<li><span class="k">${k}</span><button data-work="${esc(id)}" class="change">${esc(wtitle(id))}</button></li>`).join("")}</ul>` : `<div class="sub">No source changes.</div>`}</section>
  <section><h4>Route in this work</h4><div class="chips">${CM.POLICIES.map(([k, v]) => `<button class="chip" data-pol="${k}" aria-pressed="${S.policy === k}">${v}</button>`).join("")}</div>
    ${S.policy === "bound" ? (S.route.length ? `<ul class="list">${S.route.map((id, i) => `<li><span class="n">${i + 1}</span><button data-read="${esc(id)}">${esc(title(id))}</button> <button data-unbind="${esc(id)}" aria-label="Remove ${esc(title(id))}">×</button></li>`).join("")}</ul>` : `<div class="sub">Inspect a chamber, then press U to bind it.</div>`)
      : `<div class="sub">${targets.map(title).map(esc).slice(0, 6).join(" → ")}${targets.length > 6 ? " → …" : ""}</div>`}</section>
  <section><h4>Open threads here</h4>${threads.length ? `<ul class="list">${threads.map(t => `<li><span class="k">${CM.THREAD_TEXT[t.kind]}</span><button data-read="${esc(t.id)}">${esc(t.text)}</button></li>`).join("")}</ul>` : `<div class="sub">None in this work.</div>`}</section>
  <section><h4>Beacons here</h4>${S.beacons.size ? `<ul class="list">${[...S.beacons.values()].map(b => `<li><span class="n">${b.n}</span><button data-beacon="${esc(b.id)}">${esc(b.note || "(no note)")} · ${esc(title(b.chamber))}</button></li>`).join("")}</ul>` : `<div class="sub">B drops a numbered beacon with a note.</div>`}</section>
  <section><h4>Explored</h4><div class="row"><span>Chambers visited here</span><span>${vis} / ${secs.length}</span></div>
    <div class="row"><span>Passages traversed here</span><span>${S.traversed.size} / ${m.tunnels.size}</span></div>
    <div class="save">Reader log: ${saveTxt}${Store.failed ? " · last account save failed, kept locally" : ""} · ${events.length} events${actors > 1 ? " from " + actors + " devices" : ""}</div>
    <div class="chips"><button class="chip" id="bCopyLog">Copy log (JSONL)</button></div>
    <input id="mergeLog" class="merge" placeholder="Paste a log from the terminal or another device" autocomplete="off" aria-label="Paste a reader log to merge">
    ${matchMedia("(pointer:coarse)").matches ? `<div class="sub">Touch flight: left stick moves; drag the view to look; UP/DOWN change level. The map supports drag and pinch.</div>` : ""}</section>`;
  $("bMap").onclick = () => { if (mode === "text") closeText(); mode === "map" ? closeMap() : (openMap(), mapLatched = true); };
  $("bText").onclick = () => { if (mode === "map") closeMap(); mode === "text" ? closeText() : openText(); };
  $("bRead").onclick = () => openReader(curChamber || lastChamber);
  $("bCruise").onclick = () => { if (mode === "text") { cruiseStep(); return; } cruise ? stopCruise("stopped") : startCruise(); };
  $("bCopyLog").onclick = () => { const text = events.map(e => JSON.stringify(e)).join("\n") + "\n";
    const fallback = () => { const f = $("mergeLog"); f.value = text; f.select(); toast("Copy was blocked here: the log is selected in the field below"); };
    try { navigator.clipboard.writeText(text).then(() => toast("Copied " + events.length + " events"), fallback); } catch (_) { fallback(); } };
  $("mergeLog").addEventListener("paste", (e) => { e.preventDefault();
    const raw = (e.clipboardData || window.clipboardData).getData("text").trim(); let incoming = [];
    try { incoming = raw.startsWith("{") && raw.includes('"events"') && !raw.includes("\n{") ? JSON.parse(raw).events : raw.split("\n").filter(Boolean).map(l => JSON.parse(l)); }
    catch (_) { toast("That text is not a reader log"); return; }
    const have = new Set(events.map(x => x.id)), fresh = CM.upgrade(incoming, actor).filter(x => x.id && !have.has(x.id) && inCorpus(x));
    if (!fresh.length) { toast("Nothing new in that log"); return; }
    events = CM.merge(events, fresh); rederive(); Store.push(fresh); toast("Merged " + fresh.length + " events"); renderAll(); });
  $("panel").querySelectorAll("[data-view]").forEach(b => b.onclick = () => { if (mode === "map") closeMap(); if (mode === "text") { TN.view = b.dataset.view; TN.sel = 0; renderText(); } else openText(b.dataset.view); });
  $("panel").querySelectorAll("[data-work]").forEach(b => b.onclick = () => goToWork(b.dataset.work));
  $("panel").querySelectorAll("[data-pol]").forEach(b => b.onclick = () => { append(CM.ops.policy(b.dataset.pol)); renderAll(); });
  $("panel").querySelectorAll("[data-unbind]").forEach(b => b.onclick = () => { append(CM.ops.unbind(b.dataset.unbind)); renderAll(); });
  $("panel").querySelectorAll("[data-read]").forEach(b => b.onclick = () => openReader(b.dataset.read));
  $("panel").querySelectorAll("[data-beacon]").forEach(b => b.onclick = () => { const x = S.beacons.get(b.dataset.beacon); if (!x) return;
    if (mode === "text") closeText(); if (mode !== "map") { openMap(); mapLatched = true; } M.sel = x.id; M.target.copy(V3(x.pos)); refreshMap(); });
}
function renderAll() { renderPanel(); refreshMap(); rebuildFlightBeacons(); renderText(); }
function hud() {
  $("hudWork").textContent = wtitle(WORK).toUpperCase();
  $("hudLoc").textContent = curChamber ? title(curChamber) : curTunnel ? "passage: " + title(curTunnel.a) + " ⇄ " + title(curTunnel.b) : portalLock ? "portal: " + portalLock.dir : "";
  $("hudMode").textContent = cruise ? "CRUISE " + (cruise.speed + 1) + "/3" : "";
  $("hudRight").innerHTML = `SPD <b>${P.v.length().toFixed(1).padStart(4, "0")}</b><br>VISITED <b>${S.visited.size}</b>`;
}

/* ================= loop ================= */
let last = performance.now(), hudTick = 0, scanTick = 0;
const tmp = new THREE.Quaternion(), euler = new THREE.Euler();
function step(dt) {
  if (mode === "flight" && cruise) {
    cruise.s += SPEEDS[cruise.speed] * dt; const end = cruise.lens[cruise.lens.length - 1];
    if (cruise.s >= end) { P.pos.copy(cruise.pts[cruise.pts.length - 1]); stopCruise("arrived"); }
    else { const p = samplePath(cruise, cruise.s), ahead = samplePath(cruise, Math.min(cruise.s + 6, end)), fwd = ahead.clone().sub(p);
      if (fwd.lengthSq() > 1e-4) { const up = new THREE.Vector3(0, 1, 0).applyQuaternion(P.q);
        tmp.setFromRotationMatrix(new THREE.Matrix4().lookAt(new THREE.Vector3(), fwd, up)); P.q.slerp(tmp, Math.min(1, dt * 2.5)); } // look where you are going
      P.pos.copy(p); }
  } else if (mode === "flight") {
    const k = (c) => keys.has(c) ? 1 : 0;
    P.v.addScaledVector(new THREE.Vector3(k("KeyD") - k("KeyA") + touchFlight.x, k("KeyR") - k("KeyF") + touchFlight.y, k("KeyS") - k("KeyW") + touchFlight.z).applyQuaternion(P.q), 55 * dt);
    P.v.multiplyScalar(Math.exp(-2.6 * dt)); if (P.v.length() > 24) P.v.setLength(24);
    P.w.lerp(new THREE.Vector3(k("KeyK") + k("ArrowUp") - k("KeyJ") - k("ArrowDown"), k("KeyH") + k("ArrowLeft") - k("KeyL") - k("ArrowRight"), k("KeyQ") - k("KeyE")).multiplyScalar(1.7), Math.min(1, dt * 9));
    P.q.multiply(tmp.setFromEuler(euler.set(P.w.x * dt, P.w.y * dt, P.w.z * dt))).normalize();
    const d = P.v.clone().multiplyScalar(dt), np = P.pos.clone().add(d);
    if (allowed(np)) P.pos.copy(np);
    else for (const ax of ["x", "y", "z"]) { const t = P.pos.clone(); t[ax] += d[ax]; if (allowed(t)) P.pos.copy(t); else P.v[ax] *= -0.15; }
  } else if (mode === "map") {
    const k = (c) => keys.has(c) ? 1 : 0;
    const rot = new THREE.Vector3(k("KeyK") - k("KeyJ"), k("KeyH") - k("KeyL"), k("KeyQ") - k("KeyE")).multiplyScalar(1.4 * dt);
    M.q.multiply(tmp.setFromEuler(euler.set(rot.x, rot.y, rot.z))).normalize();
    M.dist = THREE.MathUtils.clamp(M.dist * Math.exp((k("KeyS") - k("KeyW")) * 1.4 * dt), 8, 3000);
    M.target.add(new THREE.Vector3(k("KeyD") - k("KeyA"), k("KeyR") - k("KeyF"), 0).multiplyScalar(M.dist * 0.8 * dt).applyQuaternion(M.q));
  }
  if (mode === "flight") { // where the ship is decides the log: the same traverse/enter events the text navigator writes
    const ch = chamberAt(P.pos);
    if (ch && ch.id !== curChamber) {
      const from = lastChamber; curChamber = ch.id; curTunnel = null; portalLock = null;
      append(CM.ops.cross(m, from, ch.id));
      lastChamber = ch.id; renderAll();
    } else if (!ch && curChamber) { curChamber = null; curTunnel = tunnelAt(P.pos); renderPanel(); }
    for (const g of portalGeo) { // reaching the door at the end of a portal crosses into the other work
      const atDoor = P.pos.distanceTo(g.pts[g.pts.length - 1]) < 4.5;
      if (atDoor && portalLock !== g) { portalLock = g; if (!crossInto(g, "lane")) { P.v.multiplyScalar(-0.4); } break; }
      if (!atDoor && portalLock === g && P.pos.distanceTo(g.pts[g.pts.length - 1]) > 9) portalLock = null;
    }
  }
}
function frame(t) {
  const dt = Math.min(0.05, (t - last) / 1000); last = t;
  step(dt);
  for (const r of flightObjs.reactors) r.rotation.y += dt * 0.6;
  for (const d of flightObjs.doors) d.obj.material.color.set(S.visited.has(d.target) ? COL.wire : COL.door);
  if (flightObjs.pulse) { const f = flightObjs.pulse, a = (t - f.t0) / 1200;
    if (a > 1) { workRoot.remove(f.obj); flightObjs.pulse = null; } else { f.obj.scale.setScalar(2 + a * 68); f.obj.material.opacity = 0.9 * (1 - a); } }
  // glimpses expire on their own: re-derive once a second while any scan is active
  if ((scanTick += dt) > 1) { scanTick = 0; if (S.scansActive) { rederive(); refreshMap(); renderText(); } }
  if (mode === "map") { mapCam.quaternion.copy(M.q); mapCam.position.copy(M.target).add(new THREE.Vector3(0, 0, M.dist).applyQuaternion(M.q));
    renderer.render(mapDepth === 2 ? galaxy : mapScene, mapCam); }
  else if (mode !== "text" && mode !== "read") { cam.position.copy(P.pos); cam.quaternion.copy(P.q);
    if (optical) cam.quaternion.multiply(tmp.setFromAxisAngle(new THREE.Vector3(0, 1, 0), Math.PI)); renderer.render(flight, cam); }
  if ((hudTick += dt) > 0.1) { hudTick = 0; hud(); }
  mobileVisibility();
  requestAnimationFrame(frame);
}
function resize() { const w = stage.clientWidth, h = stage.clientHeight; renderer.setSize(w, h, false);
  cam.aspect = mapCam.aspect = w / Math.max(h, 1); cam.updateProjectionMatrix(); mapCam.updateProjectionMatrix(); }
new ResizeObserver(resize).observe(stage);

/* ================= boot ================= */
events = Store.readLocal() || []; if (events.length) Store.kind = "browser";
CS = CM.deriveCorpus(C, events);
const firstWork = CS.here && C.has(CS.here) ? CS.here : [...C.works.values()].find(w => C.has(w.id)).id;
function boot() {
  loadWork(firstWork); spawn();
  append(CM.ops.session().map(e => Object.assign(e, { work: null })));
  if (!S.visited.has(curChamber)) append(CM.ops.enter(curChamber));
  bootMoved = false;
  resize(); renderAll(); updateFocusHint();
  (document.fonts ? document.fonts.ready : Promise.resolve()).then(() => refreshMap());
  stage.focus(); mobileVisibility();
  requestAnimationFrame(frame);
  Store.connect();
}
if (C.loaded(firstWork)) boot();
else C.ensure(firstWork).then(boot, (err) => { $("toast").hidden = false; $("toast").textContent = "Could not load " + wtitle(firstWork) + " (" + err.message + "). Reload to try again."; });
if (location.hash === "#debug") window.__cutaway = { // test hook only: lets a headless check fly through a portal
  state: () => ({ work: WORK, chamber: curChamber, events: events.length, jumps: CS.jumps.length, warps: CS.warps, portals: portalGeo.map(g => g.dir),
    mode, depth: mapDepth, sel: GAL.sel, works: [...C.works.keys()] }),
  screenOf(id) { const r = renderer.domElement.getBoundingClientRect(), v = V3(C.works.get(id).pos).project(mapCam);
    return [r.left + (v.x + 1) / 2 * r.width, r.top + (1 - v.y) / 2 * r.height]; },
  approach(i) { const g = portalGeo[i]; P.pos.copy(g.pts[g.pts.length - 3]); P.v.copy(g.dirv).multiplyScalar(12); curChamber = null; portalLock = null; },
  pos: () => P.pos.toArray(),
  forward: () => new THREE.Vector3(0, 0, -1).applyQuaternion(cam.quaternion).toArray(), // what the rendered camera faces
  centre: (id) => m.nodes.get(id || curChamber || lastChamber).pos,
  cruise: () => startCruise(),
};
})();
