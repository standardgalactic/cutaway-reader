}
function stopAuto() { if (TN.auto) { clearInterval(TN.auto); TN.auto = null; } }
function cruiseStep() {
  const next = CM.remainingStops(m, S, curChamber)[0];
  if (!next) { stopAuto(); tnMsg("End of route"); renderText(); return false; }
  textTravel(next); return true;
}
function tnPrompt(label, onDone) { const inp = $("tnInput"); inp.hidden = false; inp.value = ""; inp.placeholder = label; TN.input = onDone; tnMsg(label); inp.focus(); }
$("tnInput").addEventListener("keydown", (e) => {
  e.stopPropagation();
  if (e.key === "Enter") { const f = TN.input, v = $("tnInput").value; $("tnInput").hidden = true; TN.input = null; $("textnav").focus(); f && f(v); e.preventDefault(); }
  else if (e.key === "Escape") { $("tnInput").hidden = true; TN.input = null; tnMsg(""); $("textnav").focus(); e.preventDefault(); }
});
function textKey(e) {
  const k = e.key, tn = $("textnav"), item = TN.items[TN.sel];
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const handled = () => e.preventDefault();
  if (k === "Escape") { handled(); if (TN.search || TN.view) { TN.search = null; TN.view = null; TN.sel = 0; renderText(); } else closeText(); return; }
  if (k === "T" || k === "t") { handled(); closeText(); return; }
  if (k === "Tab") { handled(); closeText(); openMap(); mapLatched = true; return; }
  if (k === "j" || k === "ArrowDown") { handled(); TN.sel = Math.min(TN.sel + 1, TN.items.length - 1); renderText(); return; }
  if (k === "k" || k === "ArrowUp") { handled(); TN.sel = Math.max(TN.sel - 1, 0); renderText(); return; }
  if (k === "Enter") { handled(); follow(item); return; }
  if (/^[1-9]$/.test(k)) { handled(); follow(TN.items[+k - 1]); return; }
  if (k === "w") { handled(); const vs = C.views.map(v => v.id), i = vs.indexOf(TN.view); TN.view = vs[(i + 1) % vs.length]; TN.search = null; TN.sel = 0; renderText(); tn.scrollTop = 0; return; }
  if (TN.view) return; // the other keys act on the chamber, not on a list of works
  if (k === "h") { handled(); const to = TN.back.pop(); if (!to) { tnMsg("No earlier chamber in this work this session"); return; } textTravel(to, "back"); return; }
  if (k === "l") { handled(); const to = TN.fwd.pop(); if (!to) { tnMsg("Nothing ahead in your history"); return; } textTravel(to, "fwd"); return; }
  if (k === "i") { handled();
    if (!item || item.kind === "hit") { TN.inspect = null; renderText(); return; }
    if (item.kind === "exit") { const x = item.x, w = C.works.get(x.to_work);
      TN.inspect = esc(x.dir) + (x.oneway ? " · one-way" : " · two-way") + (w ? `<br>${esc(w.title)}: ${esc(w.abstract || "")}<br>${w.counts.sections} sections · ${CM.workState(CS, w.id)}` : "<br>Not in this corpus yet."); renderText(); return; }
    const t = m.tunnels.get(item.key), n = m.nodes.get(item.to), rel = CM.relations(m, item.to);
    TN.inspect = `${esc(title(t.a))} ⇄ ${esc(title(t.b))} · two-way · ${CM.tunnelState(S, t.key)}<br>` +
      (t.cites.length ? t.cites.map(c => `${esc(title(c.from))} cites ${esc(title(c.to))}${c.door ? " (prerequisite)" : ""}`).join("<br>") + "<br>" : "") +
      `Leads to ${esc(n.title)} · ${CM.ROLE_TEXT[n.role]} · ${CM.stateOf(S, n.id)}${n.threads.length ? " · " + n.threads.length + " open thread(s)" : ""}` +
      (rel.outs.length ? `<br>It cites: ${rel.outs.map(title).map(esc).join(", ")}` : "");
    renderText(); return; }
  if (k === "u") { handled(); tnMsg(item && item.to ? bindChamber(item.to) : "Select a passage to bind its chamber"); return; }
  if (k === "b") { handled(); tnPrompt("Beacon note, then Enter", (note) => {
      const out = append(CM.ops.beacon(m, S, { chamber: curChamber, facing: item && item.key ? item.key : null, note: note.trim() }));
      tnMsg("Beacon " + out[0].n + " dropped in " + title(curChamber)); renderAll(); }); return; }
  if (k === "s") { handled(); scan(m.nodes.get(curChamber).pos, curChamber); return; }
  if (k === "c") { handled(); cruiseStep(); return; }
  if (k === "C") { handled(); if (TN.auto) { stopAuto(); tnMsg("Auto-advance stopped"); renderText(); }
      else if (cruiseStep()) { TN.auto = setInterval(() => { if (mode !== "text" || !cruiseStep()) stopAuto(); }, 2600); tnMsg("Auto-advancing along the route · x stops"); } return; }
  if (k === "x") { handled(); stopAuto(); tnMsg("Stopped"); renderText(); return; }
  if (k === "p") { handled(); const h = historyList(12); TN.inspect = h.length ? "Your path, most recent first:<br>" + h.map(esc).join("<br>") : "No passages traversed yet."; renderText(); return; }
  if (k === "/") { handled(); tnPrompt("Search this work, then Enter", (q) => { const hits = CM.search(m, q);
      TN.search = hits.length ? { q, hits } : null; TN.sel = 0; tnMsg(hits.length ? "" : "No matches for " + q); renderText(); }); return; }
  if (k === "G") { handled(); tn.scrollTop = tn.scrollHeight; return; }
  if (k === "g") { handled(); const t = performance.now(); if (t - TN.gPending < 450) { tn.scrollTop = 0; TN.gPending = 0; } else TN.gPending = t; return; }
  if (k === "r") { handled(); $("textnav").hidden = true; $("tnBar").hidden = true; openReader(curChamber); return; }
}

/* ================= panel + HUD ================= */
$("keys").innerHTML = [["W S A D R F", "move"], ["Q E", "roll"], ["H J K L", "orient"], ["Tab ;", "map"], ["T", "text"], ["Enter", "read"],
  ["Y", "inspect"], ["U", "bind"], ["B", "beacon"], ["G", "scan"], ["O", "rear"], ["P", "path"], ["Z X C", "cruise"]]
  .map(([k, v]) => `<span><kbd>${k}</kbd> ${v}</span>`).join("");
function fmtWhen(iso) { if (!iso) return ""; return new Date(iso).toLocaleString(undefined, { weekday: "short", month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" }); }
function renderPanel() {
  const here = m.nodes.get(curChamber), prev = S.prevSession, w = C.works.get(WORK);
  const revs = m.history.filter(h => h.added.length || h.extended.length || h.withdrawn.length);
  const since = prev ? revs.filter(h => h.at > prev.at) : revs.slice(-1);
  const changes = since.flatMap(h => [...h.added.map(id => ["dug", id]), ...h.extended.map(id => ["enlarged", id]), ...h.withdrawn.map(id => ["sealed", id])]);
  const galaxyChanges = (BUNDLE.corpus.ledger.history || []).filter(h => prev && h.at > prev.at && (h.placed || h.withdrawn || h.conflict || h.restored))
    .map(h => h.placed ? ["new system", h.placed] : h.withdrawn ? ["withdrawn", h.withdrawn] : h.restored ? ["restored", h.restored] : ["placement conflict", h.conflict]);
  const threads = live.flatMap(n => n.threads.map(t => ({ ...t, id: n.id })));
  const targets = CM.routeTargets(m, S), lastT = S.trail[S.trail.length - 1];
  const secs = CM.sections(m), vis = secs.filter(n => S.visited.has(n.id)).length;
  const saveTxt = Store.kind === "account" ? "<b>Saved to your account</b>" : Store.kind === "browser" ? "<b>Saved in this browser only</b>" : "Not saved: this visit only";
  const actors = new Set(events.map(e => e.actor)).size, worksVisited = [...C.works.values()].filter(x => CS.visited.has(x.id)).length;
  $("panel").innerHTML = `
  <section><h4>${esc(C.title)}</h4><div class="big">${esc(w.title)}</div>
    <div class="sub">${w.series ? esc(C.series[w.series]?.title || w.series) + " · " : ""}${worksVisited} of ${C.works.size} works visited · ${CS.lanesUsed.size} lanes used${CS.warps ? " · " + CS.warps + " warps" : ""}</div>
    ${w.abstract ? `<div class="abstract">${esc(w.abstract)}</div>` : ""}
    <div class="chips">${C.views.map(v => `<button class="chip" data-view="${esc(v.id)}">${esc(v.title)}</button>`).join("")}</div></section>
  <section><h4>Position</h4><div class="big">${here ? esc(here.title) : curTunnel ? esc(title(curTunnel.a)) + " ⇄ " + esc(title(curTunnel.b)) : "—"}</div>
    <div class="sub">${here ? CM.ROLE_TEXT[here.role] : "in a passage"}${lastT && here && lastT.to === here.id ? " · arrived from " + esc(title(lastT.from)) : ""}</div>
    <div class="chips"><button class="chip" id="bMap">Map</button><button class="chip" id="bText">Text navigator</button><button class="chip" id="bRead">Read here</button><button class="chip" id="bCruise">${cruise ? "Stop cruise" : mode === "text" ? "Next stop" : "Cruise route"}</button></div></section>
  <section><h4>${prev ? "Since your last visit" : "Latest source revision"}</h4>
    <div class="sub">${prev ? "Last here " + fmtWhen(prev.at) : "First visit" + (since[0] ? " · revised " + fmtWhen(since[0].at) : "")}</div>
    ${changes.length || galaxyChanges.length ? `<ul class="list">${changes.map(([k, id]) => `<li><span class="k">${k}</span><button data-read="${esc(id)}" class="change">${esc(title(id))}</button></li>`).join("")}${galaxyChanges.map(([k, id]) => `<li><span class="k">${k}</span><button data-work="${esc(id)}" class="change">${esc(wtitle(id))}</button></li>`).join("")}</ul>` : `<div class="sub">No source changes.</div>`}</section>
  <section><h4>Route in this work</h4><div class="chips">${CM.POLICIES.map(([k, v]) => `<button class="chip" data-pol="${k}" aria-pressed="${S.policy === k}">${v}</button>`).join("")}</div>
    ${S.policy === "bound" ? (S.route.length ? `<ul class="list">${S.route.map((id, i) => `<li><span class="n">${i + 1}</span><button data-read="${esc(id)}">${esc(title(id))}</button> <button data-unbind="${esc(id)}" aria-label="Remove ${esc(title(id))}">×</button></li>`).join("")}</ul>` : `<div class="sub">Inspect a chamber, then press U to bind it.</div>`)
      : `<div class="sub">${targets.map(title).map(esc).slice(0, 6).join(" → ")}${targets.length > 6 ? " → …" : ""}</div>`}</section>
  <section><h4>Open threads here</h4>${threads.length ? `<ul class="list">${threads.map(t => `<li><span class="k">${CM.THREAD_TEXT[t.kind]}</span><button data-read="${esc(t.id)}">${esc(t.text)}</button></li>`).join("")}</ul>` : `<div class="sub">None in this work.</div>`}</section>
  <section><h4>Beacons here</h4>${S.beacons.size ? `<ul class="list">${[...S.beacons.values()].map(b => `<li><span class="n">${b.n}</span><button data-beacon="${esc(b.id)}">${esc(b.note || "(no note)")} · ${esc(title(b.chamber))}</button></li>`).join("")}</ul>` : `<div class="sub">B drops a numbered beacon with a note.</div>`}</section>
  <section><h4>Explored</h4><div class="row"><span>Chambers visited here</span><span>${vis} / ${secs.length}</span></div>
    <div class="row"><span>Passages traversed here</span><span>${S.traversed.size} / ${m.tunnels.size}</span></div>
    <div class="save">Reader log: ${saveTxt}${Store.failed ? " · last account save failed, kept locally" : ""} · ${events.length} events${actors > 1 ? " from " + actors + " devices" : ""}</div>
    <div class="chips"><button class="chip" id="bCopyLog">Copy log (JSONL)</button></div>
    <input id="mergeLog" class="merge" placeholder="Paste a log from the terminal or another device" autocomplete="off" aria-label="Paste a reader log to merge">
    ${matchMedia("(pointer:coarse)").matches ? `<div class="sub">Touch flight: left stick moves; drag the view to look; UP/DOWN change level. The map supports drag and pinch.</div>` : ""}</section>`;
  $("bMap").onclick = () => { if (mode === "text") closeText(); mode === "map" ? closeMap() : (openMap(), mapLatched = true); };
  $("bText").onclick = () => { if (mode === "map") closeMap(); mode === "text" ? closeText() : openText(); };
  $("bRead").onclick = () => openReader(curChamber || lastChamber);
  $("bCruise").onclick = () => { if (mode === "text") { cruiseStep(); return; } cruise ? stopCruise("stopped") : startCruise(); };
  $("bCopyLog").onclick = () => { const text = events.map(e => JSON.stringify(e)).join("\n") + "\n";
    const fallback = () => { const f = $("mergeLog"); f.value = text; f.select(); toast("Copy was blocked here: the log is selected in the field below"); };
    try { navigator.clipboard.writeText(text).then(() => toast("Copied " + events.length + " events"), fallback); } catch (_) { fallback(); } };
  $("mergeLog").addEventListener("paste", (e) => { e.preventDefault();
    const raw = (e.clipboardData || window.clipboardData).getData("text").trim(); let incoming = [];
    try { incoming = raw.startsWith("{") && raw.includes('"events"') && !raw.includes("\n{") ? JSON.parse(raw).events : raw.split("\n").filter(Boolean).map(l => JSON.parse(l)); }
    catch (_) { toast("That text is not a reader log"); return; }
    const have = new Set(events.map(x => x.id)), fresh = CM.upgrade(incoming, actor).filter(x => x.id && !have.has(x.id) && inCorpus(x));

  $("panel").querySelectorAll("[data-view]").forEach(b => b.onclick = () => { if (mode === "map") closeMap(); if (mode === "text") { TN.view = b.dataset.view; TN.sel = 0; renderText(); } else openText(b.dataset.view); });
  $("panel").querySelectorAll("[data-work]").forEach(b => b.onclick = () => goToWork(b.dataset.work));
  $("panel").querySelectorAll("[data-pol]").forEach(b => b.onclick = () => { append(CM.ops.policy(b.dataset.pol)); renderAll(); });
  $("panel").querySelectorAll("[data-unbind]").forEach(b => b.onclick = () => { append(CM.ops.unbind(b.dataset.unbind)); renderAll(); });
  $("panel").querySelectorAll("[data-read]").forEach(b => b.onclick = () => openReader(b.dataset.read));
  $("panel").querySelectorAll("[data-beacon]").forEach(b => b.onclick = () => { const x = S.beacons.get(b.dataset.beacon); if (!x) return;
    if (mode === "text") closeText(); if (mode !== "map") { openMap(); mapLatched = true; } M.sel = x.id; M.target.copy(V3(x.pos)); refreshMap(); });
}
function renderAll() { renderPanel(); refreshMap(); rebuildFlightBeacons(); renderText(); }
function hud() {
  $("hudWork").textContent = wtitle(WORK).toUpperCase();
  $("hudLoc").textContent = curChamber ? title(curChamber) : curTunnel ? "passage: " + title(curTunnel.a) + " ⇄ " + title(curTunnel.b) : portalLock ? "portal: " + portalLock.dir : "";
  $("hudMode").textContent = cruise ? "CRUISE " + (cruise.speed + 1) + "/3" : "";
  $("hudRight").innerHTML = `SPD <b>${P.v.length().toFixed(1).padStart(4, "0")}</b><br>VISITED <b>${S.visited.size}</b>`;
}

/* ================= loop ================= */
let last = performance.now(), hudTick = 0, scanTick = 0;
const tmp = new THREE.Quaternion(), euler = new THREE.Euler();
function step(dt) {
  if (mode === "flight" && cruise) {
    cruise.s += SPEEDS[cruise.speed] * dt; const end = cruise.lens[cruise.lens.length - 1];
    if (cruise.s >= end) { P.pos.copy(cruise.pts[cruise.pts.length - 1]); stopCruise("arrived"); }
    else { const p = samplePath(cruise, cruise.s), ahead = samplePath(cruise, Math.min(cruise.s + 6, end)), fwd = ahead.clone().sub(p);
      if (fwd.lengthSq() > 1e-4) { const up = new THREE.Vector3(0, 1, 0).applyQuaternion(P.q);
        tmp.setFromRotationMatrix(new THREE.Matrix4().lookAt(new THREE.Vector3(), fwd, up)); P.q.slerp(tmp, Math.min(1, dt * 2.5)); } // look where you are going
      P.pos.copy(p); }
  } else if (mode === "flight") {
    const k = (c) => keys.has(c) ? 1 : 0;
    P.v.addScaledVector(new THREE.Vector3(k("KeyD") - k("KeyA") + touchFlight.x, k("KeyR") - k("KeyF") + touchFlight.y, k("KeyS") - k("KeyW") + touchFlight.z).applyQuaternion(P.q), 55 * dt);
    P.v.multiplyScalar(Math.exp(-2.6 * dt)); if (P.v.length() > 24) P.v.setLength(24);
    P.w.lerp(new THREE.Vector3(k("KeyK") + k("ArrowUp") - k("KeyJ") - k("ArrowDown"), k("KeyH") + k("ArrowLeft") - k("KeyL") - k("ArrowRight"), k("KeyQ") - k("KeyE")).multiplyScalar(1.7), Math.min(1, dt * 9));
    P.q.multiply(tmp.setFromEuler(euler.set(P.w.x * dt, P.w.y * dt, P.w.z * dt))).normalize();
    const d = P.v.clone().multiplyScalar(dt), np = P.pos.clone().add(d);
    if (allowed(np)) P.pos.copy(np);
    else for (const ax of ["x", "y", "z"]) { const t = P.pos.clone(); t[ax] += d[ax]; if (allowed(t)) P.pos.copy(t); else P.v[ax] *= -0.15; }
  } else if (mode === "map") {
    const k = (c) => keys.has(c) ? 1 : 0;
    const rot = new THREE.Vector3(k("KeyK") - k("KeyJ"), k("KeyH") - k("KeyL"), k("KeyQ") - k("KeyE")).multiplyScalar(1.4 * dt);
    M.q.multiply(tmp.setFromEuler(euler.set(rot.x, rot.y, rot.z))).normalize();
    M.dist = THREE.MathUtils.clamp(M.dist * Math.exp((k("KeyS") - k("KeyW")) * 1.4 * dt), 8, 3000);
    M.target.add(new THREE.Vector3(k("KeyD") - k("KeyA"), k("KeyR") - k("KeyF"), 0).multiplyScalar(M.dist * 0.8 * dt).applyQuaternion(M.q));
  }
  if (mode === "flight") { // where the ship is decides the log: the same traverse/enter events the text navigator writes
    const ch = chamberAt(P.pos);
    if (ch && ch.id !== curChamber) {
      const from = lastChamber; curChamber = ch.id; curTunnel = null; portalLock = null;
      append(CM.ops.cross(m, from, ch.id));
      lastChamber = ch.id; renderAll();
    } else if (!ch && curChamber) { curChamber = null; curTunnel = tunnelAt(P.pos); renderPanel(); }
    for (const g of portalGeo) { // reaching the door at the end of a portal crosses into the other work
      const atDoor = P.pos.distanceTo(g.pts[g.pts.length - 1]) < 4.5;
      if (atDoor && portalLock !== g) { portalLock = g; if (!crossInto(g, "lane")) { P.v.multiplyScalar(-0.4); } break; }
      if (!atDoor && portalLock === g && P.pos.distanceTo(g.pts[g.pts.length - 1]) > 9) portalLock = null;
    }
  }
}
function frame(t) {
  const dt = Math.min(0.05, (t - last) / 1000); last = t;
  step(dt);
  for (const r of flightObjs.reactors) r.rotation.y += dt * 0.6;
  for (const d of flightObjs.doors) d.obj.material.color.set(S.visited.has(d.target) ? COL.wire : COL.door);
  if (flightObjs.pulse) { const f = flightObjs.pulse, a = (t - f.t0) / 1200;
    if (a > 1) { workRoot.remove(f.obj); flightObjs.pulse = null; } else { f.obj.scale.setScalar(2 + a * 68); f.obj.material.opacity = 0.9 * (1 - a); } }
  // glimpses expire on their own: re-derive once a second while any scan is active
  if ((scanTick += dt) > 1) { scanTick = 0; if (S.scansActive) { rederive(); refreshMap(); renderText(); } }
  if (mode === "map") { mapCam.quaternion.copy(M.q); mapCam.position.copy(M.target).add(new THREE.Vector3(0, 0, M.dist).applyQuaternion(M.q));
    renderer.render(mapDepth === 2 ? galaxy : mapScene, mapCam); }
  else if (mode !== "text" && mode !== "read") { cam.position.copy(P.pos); cam.quaternion.copy(P.q);
    if (optical) cam.quaternion.multiply(tmp.setFromAxisAngle(new THREE.Vector3(0, 1, 0), Math.PI)); renderer.render(flight, cam); }
  if ((hudTick += dt) > 0.1) { hudTick = 0; hud(); }
  mobileVisibility();
  requestAnimationFrame(frame);
}
function resize() { const w = stage.clientWidth, h = stage.clientHeight; renderer.setSize(w, h, false);
  cam.aspect = mapCam.aspect = w / Math.max(h, 1); cam.updateProjectionMatrix(); mapCam.updateProjectionMatrix(); }
new ResizeObserver(resize).observe(stage);

/* ================= boot ================= */
events = Store.readLocal() || []; if (events.length) Store.kind = "browser";
CS = CM.deriveCorpus(C, events);
const firstWork = CS.here && C.has(CS.here) ? CS.here : [...C.works.values()].find(w => C.has(w.id)).id;
function boot() {
  loadWork(firstWork); spawn();
  append(CM.ops.session().map(e => Object.assign(e, { work: null })));
  if (!S.visited.has(curChamber)) append(CM.ops.enter(curChamber));
  bootMoved = false;
  resize(); renderAll(); updateFocusHint();
  (document.fonts ? document.fonts.ready : Promise.resolve()).then(() => refreshMap());
  stage.focus(); mobileVisibility();
  requestAnimationFrame(frame);
  Store.connect();
}
if (C.loaded(firstWork)) boot();
else C.ensure(firstWork).then(boot, (err) => { $("toast").hidden = false; $("toast").textContent = "Could not load " + wtitle(firstWork) + " (" + err.message + "). Reload to try again."; });
if (location.hash === "#debug") window.__cutaway = { // test hook only: lets a headless check fly through a portal
  state: () => ({ work: WORK, chamber: curChamber, events: events.length, jumps: CS.jumps.length, warps: CS.warps, portals: portalGeo.map(g => g.dir),
    mode, depth: mapDepth, sel: GAL.sel, works: [...C.works.keys()] }),
  screenOf(id) { const r = renderer.domElement.getBoundingClientRect(), v = V3(C.works.get(id).pos).project(mapCam);
    return [r.left + (v.x + 1) / 2 * r.width, r.top + (1 - v.y) / 2 * r.height]; },
  approach(i) { const g = portalGeo[i]; P.pos.copy(g.pts[g.pts.length - 3]); P.v.copy(g.dirv).multiplyScalar(12); curChamber = null; portalLock = null; },
  pos: () => P.pos.toArray(),
  forward: () => new THREE.Vector3(0, 0, -1).applyQuaternion(cam.quaternion).toArray(), // what the rendered camera faces
  centre: (id) => m.nodes.get(id || curChamber || lastChamber).pos,
  cruise: () => startCruise(),
};
})();
</script>
