<title>Cutaway Reader</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
/* Single dark look by choice: this is a cockpit and an automap console. */
:root{
  color-scheme: dark;
  --bg:#030607; --stage:#000000; --panel:#081012; --panel-2:#0c1719; --line:#16292b;
  --ink:#c3d2ce; --muted:#6b8480; --wire:#dfe9e5; --revealed:#3a67d8;
  --you:#3fe07f; --route:#f2c14e; --exit:#d65ad8; --door:#ff8a3d; --thread:#ff5a52;
  --paper:#0e1416; --paper-ink:#d9e2de;
  --hud:"VT323", "Courier New", monospace;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --serif:"Source Serif 4", Georgia, "Times New Roman", serif;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.45 var(--mono);overflow:hidden}
.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 320px}
.stage{position:relative;background:var(--stage);outline:none;overflow:hidden}
.stage canvas{display:block;width:100%;height:100%}
.stage canvas{touch-action:none}
.stage:focus-visible{box-shadow:inset 0 0 0 2px var(--you)}

/* flight HUD */
.hud{position:absolute;inset:0;pointer-events:none;font-family:var(--hud);color:var(--you);letter-spacing:.04em}
.hud .tl{position:absolute;left:16px;top:12px;font-size:20px;line-height:1.05;text-shadow:0 0 6px rgba(63,224,127,.45)}
.hud .tl .work{color:var(--muted);font-size:17px}
.hud .tl .loc{color:var(--wire)}
.hud .tr{position:absolute;right:16px;top:12px;font-size:17px;text-align:right;color:var(--muted)}
.hud .tr b{font-weight:400;color:var(--you)}
.reticle{position:absolute;left:50%;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border:1px solid rgba(63,224,127,.55);border-radius:50%}
.reticle::after{content:"";position:absolute;left:50%;top:50%;width:3px;height:3px;margin:-1.5px;background:var(--you)}
.corner{position:absolute;width:22px;height:22px;border-color:rgba(63,224,127,.5);border-style:solid}
.c1{left:10px;top:10px;border-width:1px 0 0 1px}.c2{right:10px;top:10px;border-width:1px 1px 0 0}
.c3{left:10px;bottom:10px;border-width:0 0 1px 1px}.c4{right:10px;bottom:10px;border-width:0 1px 1px 0}
.rear-tag{position:absolute;left:50%;top:12%;transform:translateX(-50%);font-size:24px;color:var(--route);text-align:center;line-height:1.1}
.rear-tag ol{margin:4px 0 0;padding:0;list-style:none;font-size:18px;color:var(--you)}
.toast{position:absolute;left:50%;bottom:64px;transform:translateX(-50%);font-size:20px;color:var(--wire);background:rgba(0,0,0,.7);padding:2px 10px;max-width:calc(100% - 32px);text-align:center}
.card{position:absolute;left:50%;bottom:96px;transform:translateX(-50%);width:min(440px,calc(100% - 32px));
  background:rgba(4,10,12,.92);border:1px solid var(--line);padding:10px 12px;font:12px/1.5 var(--mono);color:var(--ink);pointer-events:none}
.card h3{margin:0 0 4px;font:22px/1 var(--hud);color:var(--wire);letter-spacing:.03em;text-wrap:balance}
.card .meta{color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-size:10.5px;margin-bottom:6px}
.card ul{margin:4px 0 0;padding-left:16px}
.keys{position:absolute;left:0;right:0;bottom:0;padding:6px 16px calc(6px + env(safe-area-inset-bottom,0px));font:15px/1.3 var(--hud);
  color:var(--muted);background:linear-gradient(transparent,rgba(0,0,0,.85));display:flex;flex-wrap:wrap;gap:4px 16px}
.keys kbd{font:inherit;color:var(--you)}
.focus-hint{position:absolute;left:50%;top:62%;transform:translateX(-50%);font:18px var(--hud);color:var(--route);text-align:center}
.mobile-controls{display:none;position:absolute;inset:0;z-index:3;pointer-events:none;font-family:var(--hud);user-select:none;-webkit-user-select:none}
.mobile-stick{position:absolute;left:18px;bottom:calc(24px + env(safe-area-inset-bottom,0px));width:112px;height:112px;border:1px solid rgba(63,224,127,.5);border-radius:50%;background:rgba(2,8,9,.55);pointer-events:auto;touch-action:none}
.mobile-knob{position:absolute;left:38px;top:38px;width:36px;height:36px;border-radius:50%;background:rgba(63,224,127,.75);box-shadow:0 0 12px rgba(63,224,127,.35)}
.mobile-actions{position:absolute;right:14px;bottom:calc(20px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(2,56px);gap:8px;pointer-events:auto}
.mobile-actions button{min-height:44px;border:1px solid rgba(63,224,127,.55);background:rgba(2,8,9,.75);color:var(--you);font:17px var(--hud);border-radius:4px;touch-action:none}
.mobile-actions button:active{background:var(--you);color:#001406}
.mobile-look{position:absolute;left:18px;bottom:calc(146px + env(safe-area-inset-bottom,0px));color:var(--muted);font-size:15px;text-shadow:0 1px 2px #000}

/* automap console frame (Descent-style) */
.stage.map .hud .reticle,.stage.map .hud .corner,.stage.map .hud .tl,.stage.map .hud .tr{display:none}
.mapframe{position:absolute;inset:0;pointer-events:none;border:10px solid #1d2a2c;box-shadow:inset 0 0 0 1px #3b5153, inset 0 0 0 3px #0b1112}
.mapframe .title{position:absolute;left:18px;top:6px;font:30px/1 var(--hud);color:#e8b04b;letter-spacing:.12em;text-shadow:0 2px 0 #6b3d05}
.mapframe .depth{position:absolute;right:18px;top:12px;font:18px var(--hud);color:var(--you)}
.mapframe .legend{position:absolute;right:18px;top:40px;font:15px/1.25 var(--hud);color:var(--muted);text-align:right}
.mapframe .ghelp{position:absolute;left:18px;bottom:40px;font:16px var(--hud);color:var(--muted)}
.panel .abstract{color:var(--ink);font-size:12px;line-height:1.5}
.legend i{display:inline-block;width:18px;height:2px;vertical-align:middle;margin-left:6px}
.lg-wire{background:var(--wire)}.lg-revealed{background:var(--revealed)}.lg-you{background:var(--you)}.lg-route{background:var(--route)}
.lg-door{background:var(--door)}.lg-exit{background:var(--exit)}.lg-thread{background:var(--thread)}
.card .meta.foot{margin:6px 0 0}

/* reading station */
.reader{position:absolute;inset:0;background:var(--paper);overflow-y:auto;outline:none;scroll-behavior:smooth}
.reader .col{max-width:64ch;margin:0 auto;padding:28px 20px 80px}
.reader figure{margin:0 0 22px;aspect-ratio:16/7;max-width:100%;border:1px solid var(--line);display:grid;place-items:center;
  background:repeating-linear-gradient(135deg,#0b1214 0 10px,#0d1618 10px 20px);color:var(--muted);font:12px var(--mono)}
.reader .role{font:11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.reader h2{font:600 30px/1.15 var(--serif);color:var(--paper-ink);margin:6px 0 18px;text-wrap:balance}
.reader p{font:18px/1.62 var(--serif);color:var(--paper-ink);margin:0 0 1em}
.reader .ref{font:13px var(--mono);color:var(--door)}
.reader .threads{margin-top:28px;border-top:1px solid var(--line);padding-top:12px;font:12.5px/1.6 var(--mono);color:var(--ink)}
.reader .back{position:sticky;top:0;background:var(--paper);padding:10px 20px;font:16px var(--hud);color:var(--muted);border-bottom:1px solid var(--line);z-index:1}
.reader .back kbd{font:inherit;color:var(--you)}

/* text navigator: a Lynx-like projection of the same world */
.textnav{position:absolute;inset:0;background:#000;color:#c8d6d2;overflow-y:auto;outline:none;font:14px/1.55 var(--mono)}
.textnav .col{max-width:86ch;margin:0 auto;padding:14px 20px 110px}
.tn-title{font:26px/1.1 var(--hud);color:var(--you);letter-spacing:.05em;margin:0 0 6px}
.tn-meta{display:grid;grid-template-columns:max-content 1fr;gap:0 14px;color:var(--muted);margin:0 0 10px}
.tn-meta dt{text-transform:uppercase;font-size:11px;letter-spacing:.1em;padding-top:2px}
.tn-meta dd{margin:0;color:var(--ink)}
.tn-h{margin:14px 0 4px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.tn-list{list-style:none;margin:0;padding:0}
.tn-list li{padding:1px 6px;display:flex;gap:10px;align-items:baseline}
.tn-list li .n{color:var(--you);min-width:3.4ch;font-variant-numeric:tabular-nums}
.tn-list li .d{color:var(--muted)}
.tn-list li .s{margin-left:auto;font-size:11px;color:var(--muted);white-space:nowrap}
.tn-list li.sel{background:var(--you);color:#000}
.tn-list li.sel .n,.tn-list li.sel .d,.tn-list li.sel .s{color:#000}
.tn-list li.glimpse{color:var(--revealed)}
.tn-list li .pre{color:var(--door)}
.tn-list li.sel .pre{color:#000}
.tn-prose{margin-top:18px;border-top:1px solid var(--line);padding-top:14px}
.tn-prose p{margin:0 0 1em;max-width:72ch;color:var(--paper-ink)}
.tn-prose .ref{color:var(--door)}
.tn-fig{color:var(--muted);font-style:italic;margin-bottom:12px}
.tn-bar{position:absolute;left:0;right:0;bottom:0;background:#050b0c;border-top:1px solid var(--line);padding:6px 16px calc(6px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:4px}
.tn-bar .msg{color:var(--route);min-height:1.4em}
.tn-bar .help{color:var(--muted);font-size:12px}
.tn-bar .help kbd{font:inherit;color:var(--you)}
.tn-bar input{font:14px var(--mono);background:#000;color:var(--wire);border:1px solid var(--you);padding:4px 8px}

/* beacon note (cockpit) */
.note{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);width:min(420px,calc(100% - 32px));
  background:#050b0c;border:1px solid var(--you);padding:12px;display:flex;flex-direction:column;gap:8px}
.note label{font:18px var(--hud);color:var(--you)}
.note input{font:14px var(--mono);background:#000;color:var(--wire);border:1px solid var(--line);padding:8px}
.note input:focus{outline:1px solid var(--you)}
.note small{color:var(--muted)}

/* supervisory panel (Stars!-style) */
.panel{background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;padding-block:12px 24px}
.panel section{padding:10px 16px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.panel h4{margin:0;font:11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:500}
.panel .big{font:22px/1.05 var(--hud);color:var(--wire);text-wrap:balance}
.panel .sub{color:var(--muted);font-size:11.5px}
.row{display:flex;justify-content:space-between;gap:8px;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:12px var(--mono);background:var(--panel-2);border:1px solid var(--line);color:var(--ink);padding:3px 8px;cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--route);color:var(--route)}
.chip:hover{border-color:var(--muted)}
.chip:focus-visible{outline:1px solid var(--you)}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.list li{display:flex;gap:8px;align-items:baseline}
.list .n{font:17px/1 var(--hud);color:var(--you);min-width:1.4em}
.list .k{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);min-width:7.5em}
.list button{all:unset;cursor:pointer;color:var(--ink)}
.list button:hover,.list button:focus-visible{color:var(--wire);text-decoration:underline}
.change{color:var(--route)}
.save{font-size:11px;color:var(--muted)}
.save b{font-weight:500;color:var(--ink)}
.merge{font:12px var(--mono);background:#000;color:var(--ink);border:1px solid var(--line);padding:5px 8px;max-width:100%}
.merge:focus{outline:1px solid var(--you)}

@media (max-width:760px){
  body{overflow:auto}
  .app{grid-template-columns:1fr;grid-template-rows:62vh auto;height:auto}
  .panel{border-left:0;border-top:1px solid var(--line)}
  .keys{font-size:13px}
}
@media (pointer:coarse){
  .mobile-controls:not([hidden]){display:block}
  .keys{display:none}
  .card{bottom:154px}
  .mapframe .ghelp{top:62px;bottom:auto;left:18px;max-width:48%;font-size:14px}
}
@media (prefers-reduced-motion:reduce){.reader{scroll-behavior:auto}}
</style>

<script type="application/json" id="level-data">{"corpus":{"graph":{"corpus":"mem8-trial","title":"Flyxion trial","series":{"mem8":{"title":"MEM|8","order":["mem8-monograph","mem8-conscious-gaia"]}},"works":[{"id":"mem8-monograph","title":"MEM|8: Memory Before Representation","abstract":"This monograph develops the MEM|8 framework from first principles. The central claim is simple but has far-reaching consequences: memory is not storage; memory is recoverable continuation.","series":"mem8","series_order":0,"provenance":{"source":null,"edition":"works/mem8-monograph/abc4fc9a52.tex","edition_how":"only","editions":[{"path":"works/mem8-monograph/abc4fc9a52.tex","sha256":"abc4fc9a525e37c7100eaa4a11e612e7115d076d9532be9b04a96d695d205c54"}]},"counts":{"sections":28,"words":7177,"threads":{},"thesis":false},"start":"G:preface","labels":["ch:prediction","ch:rust","ch:spectral"],"warnings":[{"kind":"no-thesis","severity":"advice","text":"no thesis chamber marked (add '% mine: thesis' under the central section)"},{"kind":"unlabeled","severity":"advice","text":"25 of 28 chambers have no \\label; their identity follows their headings, so a renamed heading is dug as a new chamber","titles":["Preface","The Storage Illusion","Memory as Reconstruction","The Epistemic Necessity of Memory","Events Before Objects","Histories as Computational Structures","The Event-Log Ontology","Memory as Recoverable Modal Structure","Dimensional Amplification and Witness Coordinates","Resonant Modal Recall","Forgetting as Overdamping, Repair as Resonance Restoration","Memory Outside the Brain","Habitat Versus Archive","Memory as Flux Maintenance","Forgetting as Structural Deformation","Persistent Anomalies and Scientific Memory","Memory Machines","Event-Log Computation and Spherepop","The Halting Problem and Historical Persistence","Institutional Memory","Scientific Memory","Cultural Memory","Memory Before Representation","Memory Before Identity","Memory Before Time"]}],"open_threads":[]},{"id":"mem8-conscious-gaia","title":"MEM|8 and the Possibility of a Conscious Gaia","abstract":"The strongest academic version of the conscious-Gaia claim is neither that Earth is already conscious because it is alive, complicated, or self-regulating, nor that connecting enough organisms and computers automatically produces a planetary mind. The claim is conditional and architectural: if MEM\\,|\\,8 correctly identifies an organization sufficient for consciousness, and if that organization can be instantiated across the coupled biosphere--technosphere, then a conscious Gaia is a physically intelligible possibility. This essay reconstructs that scale-extension claim in explicit terms. It distinguishes Gaian regulation from cognition and phenomenal unity; situates wave memory alongside research on phase coordination, global availability, distributed cognition, autopoiesis, and organizational closure; and connects MEM\\,|\\,8 to Marine salience, Phoenix recovery, AyeOS, semantic routing, custodial ethics, and the operations , , , and . Its central theoretical contribution is a co-individuation criterion for planetary subjecthood: six independently-motivated boundary types must identify the same continuing organization. A proposition shows that shared statistical and sensory integration is insufficient whenever authority over irreversible transitions remains separately held --- the failure mode distinguishing a single subject from a well-integrated federation. Jos\u00e9 Pacheco's Escola da Ponte supplies a mesoscopic worked example: its interest lies not in proving that institutions are conscious, but in showing how memory, attention, constraint, and agency can be properties of organized relations rather than of a commanding center. The result is a conditional theory with identifiable implementation requirements and failure tests, not an assertion that the contemporary Earth already possesses a single mind.","series":"mem8","series_order":1,"provenance":{"source":null,"edition":"w bject","Planetary Temporality","Affect and Planetary Concern","Sleep, Consolidation, and Controlled Reorganization","Operational Criteria and Failure Tests","Relation to Existing Theories","What the Argument Establishes"]}],"open_threads":[]},{"id":"cosmological-memory","title":"Primordial Distinctions and Cosmological Memory: Galactic Spin as Persistence Under Transformation","abstract":"A recent high-significance observational result reports that present-day galactic angular momenta retain a statistically recoverable relationship with the primordial tidal field acting on their protohalo progenitors. This paper treats that result not as a confirmation to be paraphrased but as a case study for a more general proposition: physical persistence across cosmic time is frequently persistence of a recoverable distinction rather than persistence of a material configuration, an object, or a microscopic state. Using the tidal-torque theory (TTT) reconstruction of Sheng et al. as an empirical anchor, we distinguish the physical primordial relation between protohalo inertia and the surrounding tidal field from the operationally reconstructible proxy actually measured, and from the present-day observable inferred from it. We develop a hierarchy running from primordial distinction through cross-scale constraint, admissible evolution, partial erasure, persistent correlation, reconstructible proxy, to present observation, and we introduce the persistence cone, a scale- and threshold-relative construction that separates physical from observable erasure of a distinction. The empirical asymmetry between gas and stellar spin tracers in Sheng et al.'s sample is used to derive a falsifiable ordering prediction rather than treated as decorative confirmation. The paper closes by arguing that cosmology, understood this way, is the discipline of asking which observables, at which scales, under which transformations, retain inferential access to distinctions established before the observed object existed.","series":null,"series_order":null,"provenance":{"source":null,"edition":"works/cosmological-memory/458d5a43c2.tex","edition_how":"proposed","editions":[{"path":"works/cosmological-memory/ec1624aa36.tex","sha256":"ec1624aa361a74934cfe8dd710813795386b3519616184c2e1723498d9384385"},{"path":"works/cosmological-memory/e8a91f2973.tex","sha256":"e8a91f297339a9862e49e17e184e45e5729696d291255474d34c9427495b2534"},{"path":"works/cosmological-memory/458d5a43c2.tex","sha256":"458d5a43c269384f1fb4e34a4d00e0e1e93c884d44725fceb267aeaa2e8407b0"}]},"counts":{"sections":24,"words":6047,"threads":{},"thesis":false},"start":"G:introduction-what-does-a-galaxy-retain","labels":[],"warnings":[{"kind":"no-thesis","severity":"advice","text":"no thesis chamber marked (add '% mine: thesis' under the central section)"},{"kind":"large-part","severity":"advice","text":"24 chambers in part '(none)' exceeds 20; split by \\part","part":null,"chambers":24},{"kind":"unlabeled","severity":"advice","text":"24 of 24 chambers have no \\label; their identity follows their headings, so a renamed heading is dug as a new chamber","titles":["Introduction: What Does a Galaxy Retain?","Tidal-Torque Theory and the Access Problem","The Reconstructible Proxy","Three Objects, Not One","The Empirical Result","From States to Trajectories","Distinction as the Unit of Cosmological Memory","Memory Without Representation","Nonlinear Evolution as an Information-Degrading Transformation","Repair Without Restoration","Recursive Repair and Historical Identity","The Plenum Reading","Angular Momentum as a Residual of Field Geometry","Entropy Growth Does Not Imply Historical Erasure","Reachability and the Persistence Cone","Physical Erasure Versus Observational Termination","A Falsifiable Ordering Prediction","Cosmological Archaeology","Indirect Inference and Neutrino Mass","A General Persistence Principle","Persistence Under Noninvertible Evolution","The Galaxy as a Historical Object","Discussion: A Lossy Historical Channel","Conclusion: The Universe Remembers Relations"]}],"open_threads":[]},{"id":"spherepop","title":"Spherepop: Histories, Continuations, and the Algebra of Reachable Computation","abstract":"Most programming languages begin with values, variables, and state transitions. Spherepop begins elsewhere: with the claim that histories are ontologically prior to states, and that computation is the progressive restriction of possibility rather than the manipulation of values.","series":null,"series_order":null,"provenance":{"source":null,"edition":"works/spherepop/061aaaa34e.tex","edition_how":"only","editions":[{"path":"works/spherepop/061aaaa34e.tex","sha256":"061aaaa34ed2143b088ca35b754a7b45c72fe28a9ec79f8c6531f00573700a0d"}]},"counts":{"sections":69,"words":40346,"threads":{},"thesis":false},"start":"G:abstract","labels":["ch:collapse-quotient","ch:compiler","sec:admissibility-set","sec:boolean-completeness","sec:layered-world-model","sec:view-vs-collapse"],"warnings":[{"kind":"no-thesis","severity":"advice","text":"no thesis chamber marked (add '% mine: thesis' under the central section)"},{"kind":"unlabeled","severity":"advice","text":"67 of 69 chambers have no \\label; their identity follows their headings, so a renamed heading is dug as a new chamber","titles":["Abstract","The Passive Theory of Notes and Its Failure","The State-Centric Assumption and Its Consequences","The Algebra of Histories","Small-Step Semantics","Collapse as Quotient","Types as Admissibility Certificates","Dependent Types and Admissibility Lattices","The Seven Note Classes as Operator Realizations","Capture Notes","Prospective Notes","Repair, Refusal, and Generative Notes","Collapse Notes and the Ephemerality Inversion","Garbage Collection as Admissibility-Guided Collapse","Error Correction as Certified Refusal","The Observation Limit","Category Theory as Engine","CLIO Projections and Active Geodesic Inference","MEM8 and the Cognitive Substrate","Repair Theory and Civilizational Collapse","Observational Entropy and Reconstruction Cost","The Geometry of Refusal","Notes as Externalized Adjoints","The Topology of Repair","The Noun Fallacy Revisited","The Hilbert Space of Histories","The Algebraic Laws as Geometry","Sigma-Algebras as Observational Frameworks","The Inverse Problem and Observational Completeness","The Coda: Implementation as Philosophical Argument","Why Spherepop Needs the Calculus of Constructions","Implementing CoC for Spherepop","Why Grammar Beats Circuits and Code","Grammar, Circuits, and the Efficiency Hierarchy","Derivation Compendium","Spherepop as a Process Algebra","The Process Calculus of Spherepop","Distributed Spherepop","The Complete Proof System","Extended Type Examples and Applications","Histories as Paths Through Possibility Space","Information-Theoretic Properties of Histories","Event Sourcing and Database Theory","Programming Language Theory Connections","Connections to Cognitive Science and MEM8","Connections to Physics and Complex Systems","Ontology of Process Versus Substance","Language, Meaning, and Semantic Collapse","Ethics, Institutions, and Civilizational Responsibility","The Spherepop Interpreter in Full","The Compiler and Virtual Machine","The Spherepop Type Checker as Its Own Subject","Historical Case Studies","Spherepop Programs as Executable Specifications","Possibility as a Computational Resource","Collapse Curvature and Fiber Geometry","The Prefix Topology and History Metrics","The Full Semantics of Bind","Reconstruction Geometry and Cost Models","Refusal Logic and the Algebra of Inadmissibility","Partial-Order Histories and True Concurrency","The Operator Representation Theorem","Counterfactuals and Causal Reasoning","Notes as a Category","Libraries, Archives, and Scientific Infrastructure","History\u2013Reachability Correspondence","Theorem Status Table"]}],"open_threads":[]},{"id":"joy-of-spherepop","title":"The Joy of Spherepop: An Event\u2013History Calculus for a Finite World","abstract":"We present Spherepop, an event--history calculus whose primitive objects are not states, but irreversible commitments. Spherepop replaces state transition systems with monotone morphisms over option--spaces, and replaces optimization with the constructive elimination of futures. By integrating categorical structure, a discrete Lagrangian mechanics of commitment, and an explicit ethics of refusal, we argue that meaning, intelligence, and agency arise only in systems that are capable of permanently constraining themselves. Spherepop thus provides both a formal language and a philosophical stance: that worldhood is generated through irreversible choice.","series":null,"series_order":null,"provenance":{"source":null,"edition":"works/joy-of-spherepop/eba530ea8b.tex","edition_how":"decided","editions":[{"path":"works/joy-of-spherepop/eba530ea8b.tex","sha256":"eba530ea8b4ce60b2e2e3ad34e9b049f2750d53a519c501c90f10b1449a7c4c3"},{"path":"works/joy-of-spherepop/0e8b97d482.tex","sha256":"0e8b97d4820729f28a80a2c7c38ba2a6f0bee8fc7b38a66ef9c4c4d80b6cd1e5"}]},"counts":{"sections":25,"words":10255,"threads":{},"thesis":false},"start":"G:introduction","labels":["app:ast","app:glossary","app:lagrangian","app:syntax","sec:collapse-quotient","sec:memory-first","sec:psychocinema","sec:refusal-authority","sec:related-work","sec:spherepop-os","sec:spherepop-vs-llms","sec:stratified-semantics","sec:syntax-semantics"],"warnings":[{"kind":"no-thesis","severity":"advice","text":"no thesis chamber marked (add '% mine: thesis' under the central section)"},{"kind":"large-part","severity":"advice","text":"25 chambers in part '(none)' exceeds 20; split by \\part","part":null,"chambers":25},{"kind":"unlabeled","severity":"advice","text":"7 of 25 chambers have no \\label; their identity follows their headings, so a renamed heading is dug as a new chamber","titles":["Introduction","The Axiom of Irreversibility","The Morphology of Choice","The Mechanics of Commitment","Renormalization through Collapse","Theorem of Refusal","Conclusion: The Ethics of the Calculus"]}],"open_threads":[]},{"id":"spherepop-os","title":"Spherepop OS: A Deterministic Semantic Operating System: Formal Specification and Architectural Rationale","abstract":"%================================================= Spherepop OS is a semantic operating system whose primary abstraction is not the process, file, or thread, but a deterministic, append-only relational event substrate. The system is designed to support collaborative, time-aware, and introspectable computation by enforcing strict causal ordering, replayability, and separation between authoritative state transitions and derived views. This document presents a formal specification of Spherepop OS, together with the rationale for each architectural choice, and establishes that the kernel's six event types reduce to four causal primitives (Pop, Refuse, Bind, Collapse) plus a small set of structural composition rules, with one event type shown to fall genuinely outside the causal basis. Building on this reduction, the specification extends the kernel with a full complement of Linux-inspired operating-system responsibilities --- process management, scheduling, a syscall boundary, a virtual object namespace, loadable modules, and capability-based permissions --- each given as a proven or explicitly flagged-as-conditional composition over the causal basis, rather than as an architectural aspiration stated only in prose. Particular emphasis is placed on determinism, observational purity, the treatment of geometry and metadata as non-causal, and the precise conditions under which multiple observers' divergent renderings of shared state remain free of contradiction. The resulting system occupies an intermediate position between an operating system kernel, a distributed database, and a semantic field theory of computation.","series":null,"series_order":null,"provenance":{"source":null,"edition":"works/spherepop-os/9e4a7995fc.tex","edition_how":"only","editions":[{"path":"works/spherepop-os/9e4a7995fc.tex","sha256":"9e4a7995fcc255f8d2e48bd40fc6f0480ca8406636b465db9236935ac2922fd3"}]},"counts":{"sections":22,"words":11055,"threads":{},"thesis":false},"start":"G:motivation-and-design-goals","labels":["sec:branch","sec:layering","sec:modules","sec:namespace-coherence","sec:permissions","sec:process-management","sec:reduction","sec:scheduling","sec:speculative-branches","sec:syscall","sec:vfs"],"warnings":[{"kind":"no-thesis","severity":"advice","text":"no thesis chamber marked (add '% mine: thesis' under the central section)"},{"kind":"large-part","severity":"advice","text":"22 chambers in part '(none)' exceeds 20; split by \\part","part":null,"chambers":22},{"kind":"unlabeled","severity":"advice","text":"12 of 22 chambers have no \\label; their identity follows their headings, so a renamed heading is dug as a new chamber","titles":["Motivation and Design Goals","Core Ontology","Authoritative Event Log","Kernel Semantics","Formal Execution Semantics","Replay Equivalence","Meta-Theorem: Functoriality of Derived Views","Diffs and Incremental Observation","Snapshots as Derived Views","Seekable Time and Historical Inspection","Layout and Geometry as Metadata","Arbiter and Collaboration Model"]}],"open_threads":[]},{"id":"portable-warrant","title":"The Portable Warrant: Evidence at the Boundary","abstract":"Modern software transports conclusions more readily than the conditions that justify them. A verifier returns success, an agent reports that a task is verified, or a theorem prover establishes a property of a translated representation; downstream components often receive only the conclusion. This paper develops Scope-Carrying Certificates (SCC) as an architecture for preserving the scope of such warrants across computational boundaries. The central criterion is property-relative: for a transformation T:D\u2192 Y to carry warrant for \u03a6:D\u2192{0,1}, \u03a6 must be constant on the relevant fibers of T. We use this criterion to place temporal history truncation, structural graph flattening, and neuro-formal translation under one account of warrant non-preservation. An implementation discipline, the Anti-Assertion Mandate, requires authorization to consume independently resolvable evidence objects rather than epistemically meaningful Boolean claims. A cross-representation implementation experiment then reconstructs the same kernel in typed Python, asynchronous orchestration, Unix-style byte streams and stores, constrained BASIC profiles, and Forth stack machines. The experiment does not establish universal correctness; it identifies a small interface that survives substantial changes in representation. The resulting principle is simple: a warrant should not cross a distinction-erasing transformation unless independently checkable evidence establishes that the erased distinction is irrelevant to the property being warranted.","series":null,"series_order":null,"provenance":{"source":null,"edition":"works/portable-warrant/1aabbe7871/portable-warrant.tex","edition_how":"only","editions":[{"path":"works/portable-warrant/1aabbe7871/portable-warrant.tex","sha256":"1aabbe78717bbe6b47b72d036f24416bdba95172e03fb3795fc462dc11277086"}]},"counts":{"sections":28,"words":6982,"threads":{},"thesis":false},"start":"G:introduction","labels":[],"warnings":[{"kind":"no-thesis","severity":"advice","text":"no thesis chamber marked (add '% mine: thesis' under the central section)"},{"kind":"large-part","severity":"advice","text":"28 chambers in part '(none)' exceeds 20; split by \\part","part":null,"chambers":28},{"kind":"unlabeled","severity":"advice","text":"28 of 28 chambers have no \\label; their identity follows their headings, so a renamed heading is dug as a new chamber","titles":["Introduction","Portable Certitude and the Fiber Criterion","The Warrant Reconstruction Limit","Three Ways to Lose a Distinction","A Calculus of Warrant Preservation","From Claims to Evidence Objects","The Three-Gate Runtime","Evidence Lifecycle and Boundary Semantics","Threat Model and Non-Goals","The Portable Kernel","Forth and the Shape of Authorization","The Operating-System Interpretation","NULL_ACTION as Operational Abstention","Warrant Algebra","Temporal Warrant and Historical Extension","A Worked Neuro-Formal Counterexample","Evidence Is Not Truth","Sound Forgetting and Portable Warrant","Related Work","Methodology and Conformance","The System Must Certify Less Than It Knows","Conclusion","Finite Fiber Counterexamples","Evidence-Chain Structure","Portable Kernel","Conformance Snapshot","Warrant Algebra Reference Laws","Machine-Readable Neuro-Formal Counterexample"]}],"open_threads":[]},{"id":"arranged-conditions","title":"Arranged Conditions: Two Accounts of the Same Fear","abstract":"A recent video essay by Adam Conover argues that the belief in AI extinction risk should be treated with suspicion, because it performs useful work for the organizations that hold it, because its flagship incidents are human-built setups presented as machine autonomy, and because it diverts public attention from present harms. This paper has two parts. Part I reconstructs that argument at full strength, grants its most durable point, which concerns the attribution of outcomes to systems whose conditions were supplied by people, and identifies where the argument overreaches. Part II offers a second account of the same material, in which risk is a property of which continuations a system is permitted to enter, by whom, and with what repair available, rather than a single probability attached to a machine's volition. The two accounts agree more than either the doom position or the skeptical position tends to admit, and they differ in what they allow one to check. Six mathematical appendices formalize the second account without assigning a probability to extinction.","series":null,"series_order":null,"provenance":{"source":null,"edition":"works/arranged-conditions/d920fc30bb.tex","edition_how":"only","editions":[{"path":"works/arranged-conditions/d920fc30bb.tex","sha256":"d920fc30bbf7ac2631f66bfa7098ffee81f2e48be3d753c247fa7eee113edc97"}]},"counts":{"sections":21,"words":9026,"threads":{},"thesis":false},"start":"G:the-argument-as-presented","labels":["app:A","app:B","app:C","app:D","app:E","app:F","prop:B3","prop:D2","prop:F2","thm:E1"],"warnings":[{"kind":"no-thesis","severity":"advice","text":"no thesis chamber marked (add '% mine: thesis' under the central section)"},{"kind":"unlabeled","severity":"advice","text":"15 of 21 chambers have no \\label; their identity follows their headings, so a renamed heading is dug as a new chamber","titles":["The Argument as Presented","The Strongest Point: Attribution","Where the Functional Account Overreaches","What Part I Establishes","From Volition to Admissible Continuation","The Conditions Are the Object","Repair, Not Reassurance","A Better Reading of the Demonstrations","What Can Be Checked","A Worked Case: The Swarm","A Worked Case: The Disputed Result","Present Harms as Gate Failures","Objections and Replies","Agreement and Departure","Conclusion"]}],"open_threads":[]},{"id":"what-probability-forgets","title":"What Probability Forgets: Projection, Interference, and the Hidden Architecture of Quantum Theory","abstract":"This is a book about quantum mechanics, but it begins with a more ordinary problem: a record can be accurate and still leave out exactly what matters next.","series":null,"series_order":null,"provenance":{"source":null,"edition":"works/what-probability-forgets/ee6cbc8a3e.tex","edition_how":"only","editions":[{"path":"works/what-probability-forgets/ee6cbc8a3e.tex","sha256":"ee6cbc8a3e656c9826d665fdefd14db5746763178bce4098ec478c73914d6a93"}]},"counts":{"sections":29,"words":13663,"threads":{},"thesis":false},"start":"G:a-note-to-the-reader","labels":[],"warnings":[{"kind":"no-thesis","severity":"advice","text":"no thesis chamber marked (add '% mine: thesis' under the central section)"},{"kind":"unlabeled","severity":"advice","text":"29 of 29 chambers have no \\label; their identity follows their headings, so a renamed heading is dug as a new chamber","titles":["A Note to the Reader","The Honest Shadow","A World Made of Columns","The Lift Above the Record","Why Probabilities Do Not Compose","Interference as Returning Memory","The Triangle That Refuses to Close","Trees, Cycles, and the Cost of Agreement","Interlude: The Arithmetic So Far","The Problem of Two Systems","What the Parts Cannot See","Why Complex Numbers Keep Returning","The Field Is Not the Theory","Interlude: Two Systems in Coordinates","A State Is Not Yet a Context","Measurements Become Operators","Time Enters Late","Inside the Birkhoff Polytope","The Cliff at Three Dimensions","Drawing the Forbidden Region","The Phase-Retrieval Problem","Decoherence and the Routes Downward","The Foundational Cost Ledger","Witnesses, Mechanisms, and Admissibility","What This Does Not Solve","A Research Programme in the Shadow","The World After the Probability","A Guide to the Technical Monograph","Further Reading"]}],"open_threads":[]},{"id":"forgotten-specification","title":"The Forgotten Specification: Human Imitation, Continuation Gain, and the Geometry of Technological Progress","abstract":"Daron Acemoglu's argument against the artificial general intelligence program, developed in What Happened to Liberal Democracy? (2026) and in a September 2026 conversation with Aaron Bastani on Novara Media's Downstream, is usually summarized as a plea for augmentation over replacement. This essay argues that the argument is more radical than that summary suggests. Its target is the choice of the human being as the specification against which machine progress is measured. Once that choice is made visible, a chain that appears to run from progress to imitation to equivalence to supersession loses its first link. The essay formalizes the alternative as a difference between two optimization objectives: overlap with human task space, and enlargement of the continuation set available to a human operating with a machine. It then states a compact separation, that aggregate capability gain does not imply continuation gain for participants, and connects it to Acemoglu's account of industrial organization as a social topology whose fragmentation removed adjacency as well as employment. Timothy Shenk's Left Adrift (2024) supplies a third instance in party politics, where the loss of unions and local organization was answered by polling and modeling: a party that could no longer reach its voters through edges began estimating them instead. A final section traces how a fictional object becomes a research target, a benchmark, a capital allocation, and finally an apparent inevitability, and defines a forgotten specification as a contingent objective that institutional commitment has reclassified from the design space into the constraint set. Shenk's history of the argument between two strategists over whether cultural polarization was fixed shows the same reclassification in electoral strategy, and suggests that the classification depends on the time horizon over which a choice is judged. A generalization, specification by organization, treats a specification as a map that enters the dynamics of what it maps, so that its later accuracy cannot establish its original necessity. Acemoglu's account of liberal democracy's promises is then read as a case of persistence of form combined with failure of continuation. The essay closes with the limits of the framework.","series":null,"series_order":null,"provenance":{"source":null,"edition":"works/forgotten-specification/890b1a4adb.tex","edition_how":"only","editions":[{"path":"works/forgotten-specification/890b1a4adb.tex","sha256":"890b1a4adbfe65307b7c26e73bffa572c66d11acce7021af890f65533bb6a752"}]},"counts":{"sections":13,"words":6194,"threads":{},"thesis":false},"start":"G:a-design-decision-presented-as-destiny","labels":["sec:factory","sec:objectives"],"warni <script>
/*
 * model.js: the canonical model shared by every Cutaway Reader interface.
 *
 * The cockpit (WebGL), the in-page text navigator and the terminal client all call these
 * functions. None of them keeps its own history: each produces the same events, appends them
 * to one reader log, and derives state from that log.
 *
 *   graph   (meaning)            -> topology: chambers, tunnels, citations, exits
 *   ledger  (remembered place)   -> positions and radii, never recomputed
 *   log     (one reader's acts)  -> append-only events with identity, merged by set union
 *
 * No rendering and no dependencies. Works as a browser global (CutawayModel) and in Node.
 */
(function (root, factory) {
  if (typeof module === "object" && module.exports) module.exports = factory();
  else root.CutawayModel = factory();
})(typeof self !== "undefined" ? self : this, function () {
  "use strict";

  // Vocabulary shared with Haplopraxis:
  //   scan   = temporary glimpse (this file)
  //   beacon = persistent personal mark (this file)
  //   flare  = persistent shared inscription (reserved; never produced or read as a scan here)
  const SCAN_MS = 20000;       // a scan is a glimpse, not a discovery
  const SCAN_RADIUS = 70;
  const ROLE_TEXT = { main: "main passage", foundation: "foundation, below", consequence: "consequence, above",
    comparison: "comparison, alongside", appendix: "appendix shaft", alcove: "alcove" };
  const THREAD_TEXT = { missing: "missing work", extension: "optional extension",
    evidence: "unresolved evidence", open: "principled openness" };
  const THREAD_CODE = { missing: "M", extension: "X", evidence: "E", open: "O" };

  const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
  const dist = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1], a[2] - b[2]);
  const pairKey = (a, b) => (a < b ? a + "|" + b : b + "|" + a);
  const other = (t, id) => (t.a === id ? t.b : t.a);

  /* ---------------- topology ---------------- */
  function build(data) {
    const G = data.graph, L = data.ledger, gById = new Map(G.nodes.map((n) => [n.id, n]));
    const nodes = new Map();
    for (const [id, l] of Object.entries(L.nodes)) {
      const g = gById.get(id) || {};
      nodes.set(id, { id, title: l.title, role: l.role, level: l.level, parent: l.parent || null,
        pos: l.pos.slice(), r: l.radius, status: l.status, thesis: !!g.thesis, threads: g.threads || [],
        text: g.text || [], image: g.image || null, order: g.order ?? 999, part: g.part || null });
    }
    const tunnels = new Map();
    for (const e of G.edges) {
      if (e.kind === "exit") continue;
      const A = nodes.get(e.from), B = nodes.get(e.to);
      if (!A || !B || A.status !== "active" || B.status !== "active") continue;
      const key = pairKey(e.from, e.to);
      if (!tunnels.has(key)) {
        const [a, b] = e.from < e.to ? [e.from, e.to] : [e.to, e.from];
        // physical traversal is two-way for every internal edge; direction lives in `cites`
        tunnels.set(key, { key, a, b, kinds: [], cites: [] });
      }
      const t = tunnels.get(key);
      if (!t.kinds.includes(e.kind)) t.kinds.push(e.kind);
      if (e.kind === "reference" || e.kind === "prerequisite") t.cites.push({ from: e.from, to: e.to, door: !!e.door });
    }
    const adj = new Map([...nodes.keys()].map((k) => [k, []]));
    for (const t of tunnels.values()) { adj.get(t.a).push(t); adj.get(t.b).push(t); }
    const exits = G.edges.filter((e) => e.kind === "exit" && nodes.get(e.from)?.status === "active")
      .map((e) => ({ from: e.from, to: e.to.replace(/^work:/, ""), oneway: e.traversal === "one-way" }));
    return { work: G.work, nodes, tunnels, adj, exits, history: L.history || [] };
  }

  const live = (m) => [...m.nodes.values()].filter((n) => n.status === "active");
  const sections = (m) => live(m).filter((n) => n.level === "section");

  function readingOrder(m) {
    const s = sections(m), by = (a, b) => a.order - b.order;
    return s.filter((n) => n.role !== "appendix").sort(by).concat(s.filter((n) => n.role === "appendix").sort(by)).map((n) => n.id);
  }
  function startChamber(m) { return readingOrder(m)[0]; }

  function pathBetween(m, a, b) {
    if (a === b) return [];
    const prev = new Map([[a, null]]), q = [a];
    while (q.length) {
      const x = q.shift(); if (x === b) break;
      for (const t of m.adj.get(x) || []) { const y = other(t, x); if (!prev.has(y)) { prev.set(y, { from: x, to: y, t }); q.push(y); } }
    }
    if (!prev.has(b)) return null;
    const hops = []; let x = b;
    while (prev.get(x)) { const s = prev.get(x); hops.unshift(s); x = s.from; }
    return hops;
  }

  function relations(m, id) {
    const outs = [], ins = [];
    for (const t of m.adj.get(id) || []) for (const c of t.cites) {
      if (c.from === id) outs.push(c.to); if (c.to === id) ins.push(c.from);
    }
    return { outs, ins };
  }

  /* ---------------- reader log: identity, ordering, union ---------------- */
  function uuid() {
    if (typeof crypto !== "undefined" && crypto.randomUUID) return crypto.randomUUID();
    return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, (c) => {
      const r = (Math.random() * 16) | 0; return (c === "x" ? r : (r & 3) | 8).toString(16); });
  }
  function fnv(str) { // two 32-bit FNV-1a passes -> 16 hex chars
    let h1 = 0x811c9dc5, h2 = 0x01000193 ^ 0x5bd1e995;
    for (let i = 0; i < str.length; i++) { const c = str.charCodeAt(i); h1 = Math.imul(h1 ^ c, 16777619); h2 = Math.imul(h2 ^ c, 2246822519); }
    return (h1 >>> 0).toString(16).padStart(8, "0") + (h2 >>> 0).toString(16).padStart(8, "0");
  }
  const newActor = () => "a-" + uuid().slice(0, 8);
  const cmp = (x, y) => x.seq - y.seq || (x.actor < y.actor ? -1 : x.actor > y.actor ? 1 : 0) || (x.id < y.id ? -1 : x.id > y.id ? 1 : 0);

  /** Give an event its identity. seq is a Lamport clock: one more than anything this actor has seen. */
  function stamp(events, actor, body, at) {
    for (const k of ["id", "actor", "seq", "at"]) if (k in body) throw new Error("event body may not set '" + k + "': identity belongs to the log");
    const seq = events.reduce((m, e) => Math.max(m, e.seq || 0), 0) + 1;
    return Object.assign({ id: uuid(), actor, seq, at: at || new Date().toISOString() }, body);
  }
  /** Set union by event id, in causal order. Nothing is ever replaced or dropped. */
  function merge(a, b) {
    const byId = new Map();
    for (const e of a) if (e && e.id) byId.set(e.id, e);
    for (const e of b) if (e && e.id && !byId.has(e.id)) byId.set(e.id, e);
    return [...byId.values()].sort(cmp);
  }
  /** Old logs (before identity existed) get ids once, deterministically ordered as they were. */
  function upgrade(events, actor) {
    let seq = 0; const beaconByN = new Map(), out = [];
    const isEarlyScan = (e) => e.t === "flare" && Array.isArray(e.pos) && !("text" in e) && !("inscription" in e);
    for (const e0 of events) {
      // Cutaway briefly called its 20-second glimpse a "flare". Same event, same id, correct name.
      const e = isEarlyScan(e0) ? Object.assign({}, e0, { t: "scan", renamedFrom: "flare" }) : e0;
      if (e.id && e.seq && e.actor) { out.push(e); if (e.t === "beacon") beaconByN.set(e.n, e.id); continue; }
      // first-version events used `id` for the chamber; move it, then give the event its own identity
      const x = Object.assign({}, e); delete x.id;
      if (["enter", "bind", "unbind", "read"].includes(e.t) && e.id && !e.chamber) x.chamber = e.id;
      // deterministic: upgrading the same legacy log twice yields the same ids, so merges stay idempotent
      Object.assign(x, { id: "legacy-" + fnv(JSON.stringify(e) + "|" + seq), actor: "legacy", seq: ++seq });
      if (x.t === "beacon") beaconByN.set(x.n, x.id);
      if (x.t === "retire" && !x.ref && beaconByN.has(x.n)) x.ref = beaconByN.get(x.n);
      out.push(x);
    }
    return out;
  }

  /* ---------------- derived reader state ---------------- */
  function derive(m, events, nowMs) {
    const now = nowMs ?? Date.now();
    const S = { visited: new Set(), traversed: new Set(), revealed: new Set(), revealedT: new Set(),
      glimpse: new Set(), glimpseT: new Set(), scansActive: 0, scanExpires: 0,
      beacons: new Map(), route: [], policy: "reading", trail: [], here: null, prevSession: null, reads: [] };
    const sessions = events.filter((e) => e.t === "session");
    S.prevSession = sessions.length > 1 ? sessions[sessions.length - 2] : null;
    for (const e of events) {
      switch (e.t) {
        case "enter": if (m.nodes.get(e.chamber)?.status === "active") { S.visited.add(e.chamber); S.here = e.chamber; } break;
        case "traverse": if (m.tunnels.has(e.key)) { S.traversed.add(e.key); S.trail.push(e); } break;
        case "scan": {
          const age = now - Date.parse(e.at);
          if (age >= 0 && age < SCAN_MS) {
            S.scansActive++; S.scanExpires = Math.max(S.scanExpires, Date.parse(e.at) + SCAN_MS);
            for (const n of m.nodes.values()) if (dist(n.pos, e.pos) < SCAN_RADIUS) S.glimpse.add(n.id);
            for (const t of m.tunnels.values()) {
              const A = m.nodes.get(t.a).pos, B = m.nodes.get(t.b).pos;
              const mid = [(A[0] + B[0]) / 2, (A[1] + B[1]) / 2, (A[2] + B[2]) / 2];
              if (dist(A, e.pos) < SCAN_RADIUS || dist(B, e.pos) < SCAN_RADIUS || dist(mid, e.pos) < SCAN_RADIUS) S.glimpseT.add(t.key);
            }
          }
          break;
        }
        case "beacon": S.beacons.set(e.id, e); break;
        case "retire": S.beacons.delete(e.ref); break;
        case "bind": if (!S.route.includes(e.chamber)) S.route.push(e.chamber); break;
        case "unbind": S.route = S.route.filter((x) => x !== e.chamber); break;
        case "policy": S.policy = e.name; break;
        case "read": S.reads.push(e.chamber); break;
      }
    }
    // Permanent knowledge comes only from being there: a visited chamber shows its own doorways.
    for (const id of S.visited) {
      S.revealed.add(id);
      for (const t of m.adj.get(id) || []) { S.revealedT.add(t.key); S.revealed.add(other(t, id)); }
    }
    for (const k of S.traversed) S.revealedT.add(k);
    for (const k of S.glimpseT) if (S.revealedT.has(k)) S.glimpseT.delete(k);
    for (const k of S.glimpse) if (S.revealed.has(k)) S.glimpse.delete(k);
    return S;
  }

  function stateOf(S, id) { return S.visited.has(id) ? "visited" : S.revealed.has(id) ? "revealed" : S.glimpse.has(id) ? "glimpsed" : "unexplored"; }
  function tunnelState(S, key) { return S.traversed.has(key) ? "traversed" : S.revealedT.has(key) ? "revealed" : S.glimpseT.has(key) ? "glimpsed" : "unexplored"; }

  /* ---------------- routes (scripts and policies) ---------------- */
  const POLICIES = [["reading", "Reading order"], ["prereq", "Prerequisites first"], ["threads", "Open threads"], ["bound", "Bound chambers"]];
  function routeTargets(m, S) {
    if (S.policy === "bound") return S.route.filter((id) => m.nodes.get(id)?.status === "active");
    const order = readingOrder(m);
    if (S.policy === "threads") return order.filter((id) => m.nodes.get(id).threads.length);
    if (S.policy === "prereq") {
      const out = [];
      for (const id of order) {
        for (const t of m.adj.get(id)) for (const c of t.cites)
          if (c.from === id && c.door && !S.visited.has(c.to) && !out.includes(c.to)) out.push(c.to);
        if (!out.includes(id)) out.push(id);

  }
  /** Remaining stops from where the reader is now. */
  function remainingStops(m, S, here) {

  /* ---------------- operations: every interface produces exactly these events ---------------- */
  const ops = {
    session: () => [{ t: "session" }],
    /** One crossing from a chamber into another: what the cockpit logs when the ship passes a wall. */
    cross(m, from, to) {
      const t = from && from !== to ? m.tunnels.get(pairKey(from, to)) : null;
      return t ? [{ t: "traverse", key: t.key, from, to }, { t: "enter", chamber: to }] : [{ t: "enter", chamber: to }];
    },
    /** Move along a real path: a sequence of crossings, identical to flying it hop by hop. */
    travel(m, from, to) {
      const hops = pathBetween(m, from, to);
      if (!hops) return null;
      return hops.flatMap((h) => ops.cross(m, h.from, h.to));

    enter: (chamber) => [{ t: "enter", chamber }],
    scan: (pos, chamber) => [{ t: "scan", pos: pos.map((v) => +(+v).toFixed(2)), chamber: chamber || null }],
    beacon(m, S, { chamber, pos, quat, facing, note }) {
      const n = Math.max(0, ...[...S.beacons.values()].map((b) => b.n || 0)) + 1;
      return [{ t: "beacon", n, chamber, pos: (pos || m.nodes.get(chamber).pos).map((v) => +(+v).toFixed(2)),
        quat: quat || null, facing: facing || null, via: S.trail.slice(-3).map((x) => x.key), note: note || "" }];
    },
    retire: (beaconEventId) => [{ t: "retire", ref: beaconEventId }],
    bind: (chamber) => [{ t: "bind", chamber }],
    unbind: (chamber) => [{ t: "unbind", chamber }],
    policy: (name) => [{ t: "policy", name }],
    read: (id) => [{ t: "read", chamber: id }],
    cruise: (policy, stops) => [{ t: "cruise", policy, stops }],
    cruiseStop: (why) => [{ t: "cruise-stop", why }],
  };

  /* ---------------- passages, described by the fixed axes ---------------- */
  function describe(m, fromId, t) {
    const toId = other(t, fromId), A = m.nodes.get(fromId), B = m.nodes.get(toId), d = sub(B.pos, A.pos);
    const ax = [0, 1, 2].reduce((best, i) => (Math.abs(d[i]) > Math.abs(d[best]) ? i : best), 2);
    const k = t.kinds;
    let dir, rank;
    if (k.includes("alcove")) { dir = B.parent === A.id ? "into alcove" : "out to the parent chamber"; rank = 6; }
    else if (k.includes("sequence") || k.includes("shaft") || k.includes("branch")) {
      // axis words name where you arrive: foundation, consequence and comparison only when you are entering one
      const vert = d[1] < 0 ? "down" : "up";
      if (B.role === "main" && A.role !== "main" && A.role !== "appendix") { dir = (ax === 1 ? "back " + vert : "back across") + " to the main passage"; rank = 2; }
      else if (A.role === "appendix" && B.role === "appendix") { dir = vert === "down" ? "down the appendix shaft" : "up the shaft to the previous appendix"; rank = vert === "down" ? 4 : 3; }
      else if (B.role === "appendix") { dir = "down the appendix shaft"; rank = 4; }
      else if (A.role === "appendix") { dir = "up the shaft to the main passage"; rank = 3; }
      else if (B.role === "foundation") { dir = "down to foundation"; rank = 4; }
      else if (B.role === "consequence") { dir = "up to consequence"; rank = 3; }
      else if (B.role === "comparison") { dir = "side passage to comparison"; rank = 5; }
      else { dir = d[2] >= 0 ? "forward in reading order" : "back in reading order"; rank = d[2] >= 0 ? 1 : 2; }
    } else {
      const c = t.cites.find((x) => x.from === fromId) || t.cites[0];
      dir = c && c.from === fromId ? "reference tunnel to a section cited here" : "reference tunnel back to a section that cites this one";
      rank = 7;
    }
    const pre = t.cites.find((c) => c.door && c.to === toId && c.from === fromId);

  }
  function passages(m, S, id) {
    return (m.adj.get(id) || []).map((t) => describe(m, id, t)).sort((a, b) => a.rank - b.rank || m.nodes.get(a.to).order - m.nodes.get(b.to).order);

  /** The textual projection of the world at one chamber. Rendered as HTML in the page and ANSI in a terminal. */
  function textView(m, S, id, portalsHere) {

      state: stateOf(S, p.to), tunnel: tunnelState(S, p.key), doorOpen: p.prereq && S.visited.has(p.to) }));
    const ex = (portalsHere || m.exits.filter((x) => x.from === id).map((x) => ({ to_work: x.to, dir: "exit to " + x.to, oneway: x.oneway, uncharted: true, chamber: x.from })))
      .filter((x) => x.chamber === id).map((x, i) => Object.assign({ n: ps.length + i + 1 }, x));
    const glimpsed = [...S.glimpseT].map((k) => m.tunnels.get(k)).filter((t) => t.a !== id && t.b !== id)
      .map((t) => ({ a: m.nodes.get(t.a).title, b: m.nodes.get(t.b).title, dir: describe(m, t.a, t).dir }));
    const counts = {};
    const threads = n.threads.map((t) => { const c = THREAD_CODE[t.kind] || "O"; counts[c] = (counts[c] || 0) + 1;
      return { code: c + counts[c], kind: t.kind, kindText: THREAD_TEXT[t.kind], text: t.text }; });
    const rel = relations(m, id);
    return {
      work: m.work, id, title: n.title, role: n.role, roleText: n.thesis ? "central thesis" : ROLE_TEXT[n.role],
      pos: n.pos, state: stateOf(S, id), arrivedFrom: last && last.to === id ? m.nodes.get(last.from).title : null,
      passages: ps, exits: ex, glimpsed, scanSeconds: S.scansActive ? Math.max(0, Math.round((S.scanExpires - Date.now()) / 1000)) : 0,
      threads, beacons: [...S.beacons.values()].filter((b) => b.chamber === id),
      cites: rel.outs.map((x) => m.nodes.get(x).title), citedBy: rel.ins.map((x) => m.nodes.get(x).title),
      alcoves: live(m).filter((x) => x.parent === id).map((x) => ({ id: x.id, title: x.title })),
      image: n.image, text: n.text,
    };
  }

  /** Search titles and prose within the work. */
  function search(m, q) {
    const s = q.trim().toLowerCase(); if (!s) return [];
    const hits = [];
    for (const n of live(m)) {
      const inTitle = n.title.toLowerCase().includes(s);
      const para = n.text.find((p) => p.toLowerCase().includes(s));
      if (inTitle || para) {
        let snip = "";
        if (para) { const i = para.toLowerCase().indexOf(s); snip = (i > 40 ? "…" : "") + para.slice(Math.max(0, i - 40), i + s.length + 60) + "…"; }
        hits.push({ id: n.id, title: n.title, snip, inTitle });

    }
    return hits.sort((a, b) => b.inTitle - a.inTitle);
  }

  /** Oracle: which chambers can be reached from the start by the graph alone. */
  function reachability(m) {
    const start = startChamber(m), seen = new Set([start]), q = [start];
    while (q.length) { const x = q.shift(); for (const t of m.adj.get(x)) { const y = other(t, x); if (!seen.has(y)) { seen.add(y); q.push(y); } } }
    return { start, reachable: seen, unreachable: live(m).filter((n) => !seen.has(n.id)).map((n) => n.id) };
  }

  /* ================= corpus: many works, one reader log ================= */
  /** bundle = { corpus: {graph, ledger}, works: { id: {graph, ledger} } } (corpus.py export).
   *  A split bundle (corpus.py export DIR folder/) carries every work's record but no work bodies; then
   *  opts.load(id) -> {graph, ledger} | null reads one synchronously (terminal), or opts.fetch(id) -> Promise
   *  does it asynchronously (browser), and C.ensure(id) must settle before C.model(id) is used. */
  function buildCorpus(bundle, opts) {
    opts = opts || {};
    const g = bundle.corpus.graph, l = bundle.corpus.ledger, works = new Map(), cache = new Map(), pending = new Map();
    for (const w of g.works) {
      const p = l.works[w.id] || {};
      works.set(w.id, Object.assign({}, w, { pos: p.pos || [0, 0, 0], status: p.status || "active", conflicts: p.conflicts || [] }));
    }
    for (const [id, p] of Object.entries(l.works)) if (!works.has(id)) // withdrawn works stay as sealed systems
      works.set(id, { id, title: id, abstract: "", series: null, counts: { sections: 0, words: 0, threads: {} }, pos: p.pos, status: p.status, conflicts: p.conflicts || [] });
    const lanes = g.lanes.map((x, i) => Object.assign({ key: laneKey(x) }, x));
    return { id: g.corpus, title: g.title, works, lanes, series: g.series || {}, views: g.views || [{ id: "galaxy", title: "Galaxy" }],
      split: !!bundle.split,
      has(id) { const w = works.get(id); return !!w && w.status === "active" && (!!bundle.works[id] || !!bundle.split); },
      loaded(id) { return cache.has(id) || !!bundle.works[id]; },
      model(id) {
        if (!cache.has(id) && !bundle.works[id] && bundle.split && opts.load && works.has(id)) { const d = opts.load(id); if (d) bundle.works[id] = d; }
        if (!cache.has(id) && bundle.works[id]) cache.set(id, build(bundle.works[id]));
        return cache.get(id) || null; },
      ensure(id) { // resolves to the model, fetching the work the first time it is needed; one request per work
        if (this.loaded(id)) return Promise.resolve(this.model(id));
        if (!bundle.split || !opts.fetch || !works.has(id)) return Promise.resolve(this.model(id));
        if (!pending.has(id)) pending.set(id, opts.fetch(id).then((d) => { bundle.works[id] = d; pending.delete(id); return this.model(id); },
          (err) => { pending.delete(id); throw err; }));
        return pending.get(id); } };
  }
  /** A single work ({graph, ledger}) is a one-work corpus, so every interface has one code path. */
  function asBundle(data) {
    if (data.corpus && data.works) return data;
    const g = data.graph, secs = g.nodes.filter((n) => n.level === "section");
    const threads = {}; for (const n of g.nodes) for (const t of n.threads) threads[t.kind] = (threads[t.kind] || 0) + 1;
    return { corpus: { graph: { corpus: g.work, title: g.work, series: {}, lanes: g.edges.filter((e) => e.kind === "exit").map((e) =>
          ({ kind: "exit", from: g.work, from_chamber: e.from, to: e.to.replace(/^work:/, "").split("#")[0], to_label: null, traversal: e.traversal, uncharted: true })),
        works: [{ id: g.work, title: g.work, abstract: "", series: null, counts: { sections: secs.length, words: g.nodes.reduce((a, n) => a + n.words, 0), threads } }],
        views: [{ id: "galaxy", title: "Galaxy" }] },
      ledger: { works: { [g.work]: { pos: [0, 0, 0], status: "active" } } } }, works: { [g.work]: data } };
  }
  function laneKey(x) { return x.kind + ":" + x.from + (x.from_chamber ? "@" + x.from_chamber : "") + ">" + x.to + (x.to_label ? "#" + x.to_label : ""); }
  /** Where a lane lands. With the work loaded, from its live chambers; otherwise from the build's own answer
   *  (the lane's to_chamber), which was computed the same way. */
  function landing(C, wid, label, hint) {
    const w = C.works.get(wid), m = C.loaded ? (C.loaded(wid) ? C.model(wid) : null) : C.model(wid);
    if (!m) return hint || w?.start || null;
    if (label && m.nodes.get("L:" + label)?.status === "active") return "L:" + label;
    return startChamber(m) || w?.start || null;
  }
  /** Every way out of a work into another, with the chamber it opens from and where it lands.
   *  Declared exits open where they were written; a two-way exit also opens a way back at its landing;
   *  series lanes open from the work's first chamber. Uncharted exits are listed but lead nowhere yet. */
  function portals(C, wid) {
    const out = [], m = C.model(wid), start = m ? startChamber(m) : C.works.get(wid)?.start || null;
    for (const x of C.lanes) {
      const back = x.to === wid && x.from !== wid;
      if (x.from !== wid && !back) continue;
      const cites = x.kind === "cites-work", named = (id, t) => C.works.get(id)?.title || t || id;
      if ((x.kind === "exit" || cites) && !back) out.push({ lane: x.key, chamber: x.from_chamber, to_work: x.to, to_chamber: x.uncharted ? null : landing(C, x.to, x.to_label, x.to_chamber),
        to_title: named(x.to, x.to_title), dir: (cites ? "cites " : "exit to ") + named(x.to, x.to_title), oneway: x.traversal === "one-way",
        uncharted: !!x.uncharted, inferred: !!x.inferred, kind: cites ? "cites-work" : "exit" });
      else if ((x.kind === "exit" || cites) && back && x.traversal !== "one-way" && !x.uncharted) out.push({ lane: x.key, chamber: landing(C, wid, x.to_label, x.to_chamber), to_work: x.from, to_chamber: x.from_chamber,
        to_title: named(x.from), dir: (cites ? "cited by " : "exit back to ") + named(x.from) + sectionOf(C, x.from, x.from_chamber, x.from_chamber_title), oneway: false, uncharted: false, inferred: !!x.inferred, kind: cites ? "cited-by" : "exit-back" });
      else if (x.kind === "series") { const other = back ? x.from : x.to;
        out.push({ lane: x.key, chamber: start, to_work: other, to_chamber: landing(C, other, null, back ? null : x.to_chamber), kind: "series",
          dir: (back ? "previous" : "next") + " in series: " + (C.works.get(other)?.title || other), oneway: false, uncharted: false }); }
    }

  }
  /** " (§ Section title)" for the chamber a way back leads to, so two ways back to one work stay distinguishable. */
  function sectionOf(C, wid, chamber, known) {
    const t = (C.loaded && !C.loaded(wid) ? null : C.model(wid)?.nodes.get(chamber)?.title) || known; return t ? " (§ " + t + ")" : ""; }
  /** Crossing into another work: a jump, then an enter that belongs to the destination. */
  ops.jump = (fromWork, fromChamber, portal) => [
    { t: "jump", work: fromWork, from_work: fromWork, from_chamber: fromChamber, to_work: portal.to_work, to_chamber: portal.to_chamber, lane: portal.lane || null },
    { t: "enter", work: portal.to_work, chamber: portal.to_chamber },
  ];
  /** Arriving in a work from outside any lane (a chosen system in the galaxy, a search). Recorded as a warp, honestly. */
  ops.warp = (fromWork, fromChamber, toWork, toChamber) => ops.jump(fromWork, fromChamber, { to_work: toWork, to_chamber: toChamber, lane: null });

  const workEvents = (events, wid) => events.filter((e) => !e.work || e.work === wid);
  function deriveCorpus(C, events) {
    const CS = { visited: new Set(), revealed: new Set(), lanesUsed: new Set(), here: null, hereChamber: null, jumps: [], warps: 0 };
    for (const e of events) {
      if (e.t === "enter" && e.work && C.works.has(e.work)) { CS.visited.add(e.work); CS.here = e.work; CS.hereChamber = e.chamber; }
      else if (e.t === "jump") { CS.jumps.push(e); if (e.lane) CS.lanesUsed.add(e.lane); else CS.warps++; }
    }
    for (const w of CS.visited) { CS.revealed.add(w); for (const x of C.lanes) { if (x.from === w && !x.uncharted) CS.revealed.add(x.to); if (x.to === w) CS.revealed.add(x.from); } }
    return CS;
  }
  const workState = (CS, id) => (CS.visited.has(id) ? "visited" : CS.revealed.has(id) ? "revealed" : "unexplored");

  /** Declared views: sorts and filters over the same work records (Notes views, Stars! reports). */
  function view(C, CS, id) {
    const v = C.views.find((x) => x.id === id) || C.views[0];
    const works = [...C.works.values()].filter((w) => w.status !== "withdrawn");
    const here = C.works.get(CS.here);
    const row = (w, extra) => Object.assign({ work: w.id, title: w.title, state: workState(CS, w.id),
      sub: `${w.counts.sections} sections · ${w.counts.words} words` + (w.conflicts.length ? " · placement conflict" : "") }, extra || {});
    let rows;
    if (v.select === "threads") {
      rows = [];
      for (const w of works) { // from the record, so the view needs no work loaded; a loaded work speaks for itself
        const m = C.loaded && !C.loaded(w.id) ? null : C.model(w.id);
        const list = m ? live(m).flatMap((n) => n.threads.map((t) => ({ chamber: n.id, chamber_title: n.title, kind: t.kind, text: t.text })))
                       : (w.open_threads || []);
        for (const t of list) rows.push({ work: w.id, chamber: t.chamber, title: w.title, state: workState(CS, w.id),
          group: THREAD_TEXT[t.kind], sub: t.text + " · " + t.chamber_title }); }
      rows.sort((a, b) => a.group.localeCompare(b.group));
    } else if (v.select === "unvisited") rows = works.filter((w) => !CS.visited.has(w.id)).map((w) => row(w));
    else if (v.group === "series") {
      rows = [];
      for (const [sid, s] of Object.entries(C.series)) for (const id of s.order) { const w = C.works.get(id); if (w && w.status !== "withdrawn") rows.push(row(w, { group: s.title })); }
      for (const w of works) if (!w.series) rows.push(row(w, { group: "Not in a series" }));
    } else if (v.sort === "-words") rows = works.slice().sort((a, b) => b.counts.words - a.counts.words).map((w) => row(w));
    else rows = works.slice().sort((a, b) => (here ? dist(a.pos, here.pos) - dist(b.pos, here.pos) : a.title.localeCompare(b.title)))
      .map((w) => row(w, { sub: (here && w.id !== here.id ? Math.round(dist(w.pos, here.pos)) + " away · " : "") + `${w.counts.sections} sections` + (w.conflicts.length ? " · placement conflict" : "") }));
    return { id: v.id, title: v.title, rows, views: C.views.map((x) => ({ id: x.id, title: x.title })) };
  }
  function corpusReachability(C) {
    const ids = [...C.works.values()].filter((w) => w.status !== "withdrawn").map((w) => w.id);
    const start = ids[0], seen = new Set([start]), q = [start];
    while (q.length) { const x = q.shift();
      for (const l of C.lanes) { if (l.uncharted) continue; const y = l.from === x ? l.to : (l.to === x && l.traversal !== "one-way" ? l.from : null);
        if (y && !seen.has(y) && ids.includes(y)) { seen.add(y); q.push(y); } } }
    return { start, unreachable: ids.filter((i) => !seen.has(i)), uncharted: C.lanes.filter((l) => l.uncharted).map((l) => l.from + " -> " + (l.to_title || l.to)) };
  }

  return { asBundle, buildCorpus, portals, deriveCorpus, workState, view, workEvents, corpusReachability, laneKey,
    SCAN_MS, SCAN_RADIUS, ROLE_TEXT, THREAD_TEXT, POLICIES, build, live, sections, readingOrder, startChamber,
    pathBetween, relations, pairKey, other, newActor, stamp, merge, upgrade, derive, stateOf, tunnelState,
    routeTargets, remainingStops, ops, passages, describe, textView, search, reachability, dist };
});

<script>
(() => {
"use strict";
const CM = window.CutawayModel;
const BUNDLE = CM.asBundle(JSON.parse(document.getElementById("level-data").textContent));
const C = CM.buildCorpus(BUNDLE, { // a split export (index + works/<id>.json) is fetched a work at a time
  fetch: (id) => fetch(BUNDLE.split + encodeURIComponent(id) + ".json").then(r => r.ok ? r.json() : Promise.reject(new Error(r.status + " " + id))) });
const V3 = (a) => new THREE.Vector3(a[0], a[1], a[2]);
const css = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const COL = { wire: css("--wire"), revealed: css("--revealed"), you: css("--you"), route: css("--route"),

const SPEEDS = [5, 10, 18];
function startCruise() {

  const stops = CM.remainingStops(m, S, curChamber);
  if (!stops.length) { toast(S.policy === "bound" ? "No chambers bound yet: inspect one with Y, then press U" : "You are at the end of this route"); return; }
  const pts = [P.pos.clone(), V3(m.nodes.get(curChamber).pos)]; let at = curChamber; const used = [];
  for (const tgt of stops) { const hops = CM.pathBetween(m, at, tgt); if (!hops) continue;
    for (const h of hops) { const g = geo.get(h.t.key), seq = g.a === h.from ? g.pts : g.pts.slice().reverse(); pts.push(...seq.slice(1)); }
    used.push(tgt); at = tgt; }
  if (pts.length < 3) { toast("No passage leads there"); return; }
  const lens = [0]; for (let k = 1; k < pts.length; k++) lens.push(lens[k - 1] + pts[k].distanceTo(pts[k - 1]));
  cruise = { pts, lens, s: 0, speed: 1, stops: used }; keys.clear(); P.v.set(0, 0, 0);
  append(CM.ops.cruise(S.policy, used)); toast("Cruise: " + used.length + " chambers · Z slower · C faster · X stop"); renderAll();
}

function samplePath(c, s) { let k = 1; while (k < c.lens.length - 1 && c.lens[k] < s) k++;
  const f = (s - c.lens[k - 1]) / Math.max(c.lens[k] - c.lens[k - 1], 1e-6); return c.pts[k - 1].clone().lerp(c.pts[k], THREE.MathUtils.clamp(f, 0, 1)); }
